<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
html { min-width: 600px; }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow', 'Segoe UI', sans-serif;
  background: #f5f2ec;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  gap: 12px;
}

.toolbar {
  width: 100%;
  max-width: 1200px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #eae6de;
  border: 1px solid #c8bfa8;
  border-radius: 12px;
  padding: 10px 18px;
  flex-wrap: wrap;
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 200px;
}
.toolbar-label {
  color: #3a4a3a;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.toolbar select {
  background: #f5f2ec;
  color: #2d3a2d;
  border: 1px solid #c8bfa8;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  outline: none;
  flex: 1;
}
.toolbar select:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.toolbar-group-pv {
  flex: 0 0 auto;
  min-width: unset;
}
.toolbar-group-lang {
  flex: 0 0 auto;
  min-width: unset;
}
.pv-input {
  background: #f5f2ec;
  color: #2d3a2d;
  border: 1px solid #c8bfa8;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  outline: none;
  width: 150px;
  text-align: right;
  font-family: 'Barlow', 'Segoe UI', sans-serif;
}
.pv-input:focus {
  border-color: #5a7a5a;
  background: #fff;
}

.main-layout {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  width: 100%;
  max-width: 1200px;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 140px;
  flex-shrink: 0;
  padding-top: 4px;
}
.sidebar-title {
  color: #3a4a3a;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  text-align: center;
  margin-bottom: 4px;
}
.tray {
  background: #eae6de;
  border: 1px solid #c8bfa8;
  border-radius: 10px;
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tray.dragover {
  background: #d4ddd4;
  border-color: #5a7a5a;
}
.tray-slot {
  width: 130px;
  height: 50px;
  border: 1.5px dashed #c8bfa8;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: rgba(245,242,236,0.6);
  transition: background 0.15s;
}
.tray-slot.has-card {
  border-style: solid;
  border-color: transparent;
  background: transparent;
}

.infographic-wrapper {
  flex: 1;
  position: relative;
  min-width: 500px;
}
#export-target {
  position: relative;
  width: 100%;
  border-radius: 8px;
  outline: 3px solid #c8bfa8;
}
.bg-img {
  width: 100%;
  display: block;
  border-radius: 8px;
}
.overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

/* ── Infografika szöveg overlay-ek ── */
.infog-filter-label,
.infog-subtitle,
.infog-pv-label {
  position: absolute;
  pointer-events: none;
  display: flex;
  align-items: center;
  overflow: hidden;
  font-family: 'Barlow Condensed', 'Segoe UI', sans-serif;
}
/* Felső fehér terület: 0%-13% */
.infog-filter-label {
  top: 0; left: 7%; right: 0; height: 13%;
  justify-content: flex-start;
  color: #2d5a1b;
  font-weight: 700;
  font-size: 1.8vw;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  z-index: 10;
}
/* Zöld sáv: 13%-18.5% */
.infog-subtitle {
  top: 13%; left: 11%; right: 25%; height: 5.5%;
  color: white;
  font-weight: 600;
  font-size: 0.95vw;
  z-index: 10;
}
/* Nagy fekete sáv: 44.8%-51.4% */
.infog-pv-label {
  top: 44.8%; left: 8%; right: 27%; height: 6.6%;
  justify-content: flex-start;
  color: white;
  font-weight: 600;
  font-size: 1.05vw;
  white-space: normal;
  z-index: 10;
}

.export-bar {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px;
}
.export-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 18px;
  border-radius: 8px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}
.export-btn:hover {
  opacity: 0.85;
  transform: translateY(-1px);
}
.export-btn:active { transform: translateY(0); }
.export-btn.png { background: #5a7a5a; color: #fff; }
.export-btn.pdf { background: #7a5a3a; color: #fff; }
.export-btn svg { flex-shrink: 0; }

.dragdrop-area {
  position: absolute;
  top: 51.5%;
  left: 4.5%;
  transform-origin: top left;
  display: flex;
  align-items: flex-start;
  pointer-events: all;
}
.panel {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.panel-slots {
  display: flex;
  flex-direction: column-reverse;
  justify-content: flex-end;
  background: transparent;
  overflow: visible;
}
.panel-side { margin-top: 18px; }
.slot {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: visible;
  transition: background 0.15s;
}
.slot.slot-dragover {
  background: rgba(90,122,90,0.15);
  border-radius: 6px;
}
.empty-slot {
  background: rgba(200,191,168,0.3);
  border-radius: 6px;
}
.export-hide { visibility: hidden; }

.card {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  user-select: none;
  position: relative;
  z-index: 1;
  overflow: visible;
}
.card:active { cursor: grabbing; }
.card-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: fill;
  pointer-events: none;
}
.card-icon {
  position: absolute;
  left: 20px; top: 50%;
  transform: translateY(-50%);
  height: 70%;
  width: auto;
  pointer-events: none;
  object-fit: contain;
}
.card-icon-car {
  position: absolute;
  left: 20px; top: 50%;
  transform: translateY(-50%);
  height: 92%;
  width: auto;
  pointer-events: none;
  object-fit: contain;
}
.card-icon-house {
  position: absolute;
  left: 20px; top: 50%;
  transform: translateY(-50%);
  height: 118%;
  width: auto;
  pointer-events: none;
  object-fit: contain;
}
.card-icon-tray {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  height: 65%;
  width: auto;
  pointer-events: none;
  object-fit: contain;
}
.card-value-tray {
  position: absolute;
  right: 6px; top: 50%;
  transform: translateY(-50%);
  color: white;
  font-weight: bold;
  font-size: 10px;
  pointer-events: none;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
}
.card-text {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  pointer-events: none;
  gap: 3px;
}
.card-text.indent { right: 28px; }
.card-number {
  color: white;
  font-weight: 700;
  font-size: 15px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
  line-height: 1.1;
}
.card-unit {
  color: white;
  font-weight: 600;
  font-size: 9px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
  margin-left: 3px;
  vertical-align: middle;
}
.card-label {
  color: #f5f500;
  font-weight: 600;
  font-size: 8px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: normal;
  text-align: right;
  max-width: 100px;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.card.dragging { opacity: 0.35; }

.middle-wrapper {
  position: relative;
  display: inline-block;
}
.middle-img {
  display: block;
  pointer-events: none;
}
.middle-text {
  position: absolute;
  bottom: 18%; left: 45%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  gap: 2px;
}
.middle-value {
  color: #f5f500;
  font-weight: bold;
  font-size: 20px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
  line-height: 1.1;
}
.middle-label {
  color: white;
  font-weight: 600;
  font-size: 9px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: normal;
  text-align: center;
  max-width: 180px;
  text-transform: uppercase;
  letter-spacing: 0;
  line-height: 1.2;
}

#export-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(245,242,236,0.88);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: #2d3a2d;
  font-size: 16px;
}
#export-overlay.visible { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid #c8bfa8;
  border-top-color: #5a7a5a;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="toolbar" id="toolbar">
  <div class="toolbar-group">
    <span class="toolbar-label">Website:</span>
    <select id="sel-website" onchange="onWebsiteChange(this.value)"></select>
  </div>
  <div class="toolbar-group">
    <span class="toolbar-label">Page type:</span>
    <select id="sel-pagetype" onchange="onPagetypeChange(this.value)"></select>
  </div>
  <div class="toolbar-group toolbar-group-pv">
    <span class="toolbar-label">Page visits:</span>
    <input type="text" id="pv-input" class="pv-input" value="120 000 000"
      oninput="onPVInput(event)" onblur="onPVBlur(event)" />
  </div>
</div>

<div class="main-layout" id="main-layout">
  <div class="sidebar">
    <div class="sidebar-title">Left tray</div>
    <div class="tray" id="tray-left"></div>
  </div>

  <div class="infographic-wrapper">
    <div id="export-target">
      <img class="bg-img" id="bg-img" src="cards/empty_template.png" crossorigin="anonymous"/>
      <div class="infog-filter-label" id="infog-filter-label"></div>
      <div class="infog-subtitle" id="infog-subtitle"></div>
      <div class="infog-pv-label" id="infog-pv-label"></div>
      <div class="overlay">
        <div class="dragdrop-area" id="dragdrop-area">
          <div class="panel panel-side">
            <div class="panel-slots" id="left" style="width:200px;"></div>
          </div>
          <div class="panel">
            <div class="middle-wrapper">
              <img id="middle" class="middle-img" style="height:187px; width:194px;" src="cards/ora_egyedul.png" crossorigin="anonymous"/>
              <svg id="needle-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;" viewBox="0 0 194 187">
                <g id="needle-line" style="transform-origin: 85.5px 84px; transform: rotate(-90deg);">
                  <path d="M85.5,34 L90.5,84 L80.5,84 Z" fill="#444444"/>
                  <circle cx="85.5" cy="84" r="6" fill="#444444"/>
                </g>
              </svg>
              <div class="middle-text">
                <span class="middle-value" id="middle-value"></span>
                <span class="middle-label" id="middle-label"></span>
              </div>
            </div>
          </div>
          <div class="panel panel-side">
            <div class="panel-slots" id="right" style="width:180px;"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="export-bar">
      <button class="export-btn pdf" onclick="exportPDF()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        PDF export
      </button>
      <button class="export-btn png" onclick="exportPNG()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Save image
      </button>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-title">Right tray</div>
    <div class="tray" id="tray-right"></div>
  </div>
</div>

<div id="export-overlay">
  <div class="spinner"></div>
  <span id="export-msg"></span>
</div>

<script>
const RAW_STATS_RAW   = `{{RAW_STATS}}`;
const LABELS_RAW      = `{{LABELS}}`;
const WEBSITES_RAW    = `{{WEBSITES}}`;
const PAGETYPES_RAW   = `{{PAGETYPES}}`;
const CONSTANTS_RAW   = `{{CONSTANTS}}`;
const PANEL_STATE_RAW = `{{PANEL_STATE}}`;

let rawStats  = {};
let labels    = {};
let websites  = [];
let pagetypes = {};
let C         = {};

try { rawStats  = JSON.parse(RAW_STATS_RAW); }  catch(e){}
try { labels    = JSON.parse(LABELS_RAW); }     catch(e){}
try { websites  = JSON.parse(WEBSITES_RAW); }   catch(e){}
try { pagetypes = JSON.parse(PAGETYPES_RAW); }  catch(e){}
try { C         = JSON.parse(CONSTANTS_RAW); }  catch(e){}

// Elmentett panel állapot visszatöltése (Pythonból jön)
let savedPanel = null;
try {
  if (PANEL_STATE_RAW && PANEL_STATE_RAW !== 'null') {
    savedPanel = JSON.parse(PANEL_STATE_RAW);
  }
} catch(e) {}

let currentWebsite  = savedPanel?.website  || websites[0] || '';
let currentPagetype = savedPanel?.pagetype !== undefined ? savedPanel.pagetype : '';
let currentPV       = savedPanel?.pv       || C.default_pv || 120000000;

// panelState alapértelmezett, felülírja a savedPanel ha van
let panelState = { trayLeft:['kg_co2','wash','bp_paris'], trayRight:['kg_saved','kwh','house'], left:[], right:[] };
if (savedPanel?.trayLeft) panelState = {
  trayLeft:  savedPanel.trayLeft,
  trayRight: savedPanel.trayRight,
  left:      savedPanel.left,
  right:     savedPanel.right,
};

// Állapot küldése Pythonnak query param-on keresztül
function sendStateToParent() {
  try {
    const state = {
      trayLeft:  panelState.trayLeft,
      trayRight: panelState.trayRight,
      left:      panelState.left,
      right:     panelState.right,
      website:   currentWebsite,
      pagetype:  currentPagetype,
      pv:        currentPV,
    };
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    const url = new URL(window.parent.location.href);
    url.searchParams.set('cc_state', encoded);
    window.parent.history.replaceState(null, '', url.toString());
  } catch(e) {}
}

function huFormat(val) {
  return Math.round(val).toLocaleString('hu-HU').replace(/,/g, ' ');
}

function calcFromRaw(raw, pv) {
  const kg_co2   = raw.em_avg * pv / 1000;
  const kg_saved = kg_co2 * raw.red_pct;
  const kwh      = kg_saved / C.CO2_PER_KWH;
  const bp_km    = kg_co2 / C.CO2_PER_KM;
  const bp_trips = Math.round(bp_km / C.ref_km);
  return {
    kg_co2:               { num: huFormat(kg_co2),   unit: 'KG CO2E' },
    wash:                 { num: huFormat(kg_co2 / C.CO2_PER_WASH), unit: labels['unit_db']?.description || '' },
    bp_paris_trips:       { num: huFormat(bp_km),    unit: 'KM' },
    bp_paris_trips_count: bp_trips,
    kg_saved:             { num: huFormat(kg_saved), unit: 'KG CO2E' },
    kwh:                  { num: huFormat(kwh),      unit: 'KWH' },
    house:                { num: huFormat(kwh / C.KWH_PER_HOUSE), unit: '' },
    red_pct:              (raw.red_pct * 100).toFixed(1) + '%',
  };
}

function statsKey(website, pagetype) {
  if (!pagetype) return website === 'Összesítő' ? 'Összesítő' : website + '|';
  return `${website}|${pagetype}`;
}

function getCurrentCalc() {
  const key = statsKey(currentWebsite, currentPagetype);
  const raw = rawStats[key];
  if (!raw) return {};
  return calcFromRaw(raw, currentPV);
}

function formatPVDisplay(val) {
  return Math.round(val).toLocaleString('hu-HU').replace(/,/g, ' ');
}

function parsePV(str) {
  const n = parseInt(str.replace(/\D/g, ''), 10);
  return (isNaN(n) || n <= 0) ? null : n;
}

function onPVInput(e) {
  const val = parsePV(e.target.value);
  if (val) { currentPV = val; updateValues(); updateTexts(); }
}

function onPVBlur(e) {
  const val = parsePV(e.target.value);
  e.target.value = formatPVDisplay(val || currentPV);
}

function buildWebsiteSelector() {
  const el = document.getElementById('sel-website');
  el.innerHTML = '';
  websites.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w;
    opt.textContent = w === 'Összesítő' ? (labels['all_website']?.description || w) : w;
    if (w === currentWebsite) opt.selected = true;
    el.appendChild(opt);
  });
}

function buildPagetypeSelector(website) {
  const el = document.getElementById('sel-pagetype');
  el.innerHTML = '';
  const pts = pagetypes[website] || [];
  if (pts.length === 0) {
    el.disabled = true;
    const opt = document.createElement('option');
    opt.textContent = '–';
    el.appendChild(opt);
    return;
  }
  el.disabled = false;
  const allOpt = document.createElement('option');
  allOpt.value = '';
  allOpt.textContent = labels['all_pagetype']?.description || 'All pages';
  if (currentPagetype === '') allOpt.selected = true;
  el.appendChild(allOpt);
  pts.forEach(pt => {
    const opt = document.createElement('option');
    opt.value = pt; opt.textContent = pt;
    if (pt === currentPagetype) opt.selected = true;
    el.appendChild(opt);
  });
}

function onWebsiteChange(website) {
  currentWebsite  = website;
  currentPagetype = '';
  buildPagetypeSelector(website);
  updateValues();
}

function onPagetypeChange(pagetype) {
  currentPagetype = pagetype;
  updateValues();
}

// ── Szöveg összerakás ────────────────────────────────────────────────────────
// CO2 alsó indexként: "CO\u2082" unicode karakterrel, hogy textContent-tel is működjön
function buildFilterLabel() {
  const site = currentWebsite === 'Összesítő'
    ? (labels['all_website']?.description || 'Összesítő')
    : currentWebsite;
  const pt = currentPagetype || (labels['all_pagetype']?.description || 'All pages');
  const sep = currentPagetype ? ': ' : ' – ';
  return `${site}${sep}${pt}`;
}

function buildSubtitle() {
  if (currentWebsite === 'Összesítő' || !currentWebsite) {
    const n = (websites || []).filter(w => w !== 'Összesítő').length;
    const template = labels['subtitle_multi']?.description || 'What is the CO\u2082e footprint of the {} websites examined?';
    return template.replace('{}', n);
  }
  const template = labels['subtitle_single']?.description || 'What is the CO\u2082e footprint of {}?';
  return template.replace('{}', currentWebsite);
}

function buildPVLabel() {
  const pvStr = formatPVDisplay(currentPV);
  if (currentWebsite === 'Összesítő' || !currentWebsite) {
    const n = (websites || []).filter(w => w !== 'Összesítő').length;
    const pt = currentPagetype ? `: ${currentPagetype}` : '';
    const template = labels['pv_multi']?.description || 'For {} page views across {} websites{}';
    return template.replace('{}', pvStr).replace('{}', n).replace('{}', pt);
  }
  const pt = currentPagetype ? `: ${currentPagetype}` : '';
  const template = labels['pv_single']?.description || 'For {} page views – {}{}';
  return template.replace('{}', pvStr).replace('{}', currentWebsite).replace('{}', pt);
}

function updateTexts() {
  const filterEl   = document.getElementById('infog-filter-label');
  const subtitleEl = document.getElementById('infog-subtitle');
  const pvEl       = document.getElementById('infog-pv-label');
  if (filterEl)   filterEl.textContent   = buildFilterLabel();
  if (subtitleEl) subtitleEl.textContent = buildSubtitle();
  if (pvEl)       pvEl.textContent       = buildPVLabel();
}

// ── Kártya értékek ──────────────────────────────────────────────────────────
const BASE_SCALE = 0.57;
const DIMS = {
  bal: {
    tarolo:       { w: 130, h: 50 },
    fent:         { w: Math.round(320*BASE_SCALE), h: Math.round(97*BASE_SCALE) },
    kozep:        { w: Math.round(320*BASE_SCALE), h: Math.round(97*BASE_SCALE) },
    lent:         { w: Math.round(353*BASE_SCALE), h: Math.round(104*BASE_SCALE) },
    lent_egyedul: { w: Math.round(353*BASE_SCALE), h: Math.round(104*BASE_SCALE) },
  },
  jobb: {
    tarolo:       { w: 130, h: 50 },
    fent:         { w: Math.round(320*BASE_SCALE), h: Math.round(97*BASE_SCALE) },
    kozep:        { w: Math.round(320*BASE_SCALE), h: Math.round(97*BASE_SCALE) },
    lent:         { w: Math.round(320*BASE_SCALE), h: Math.round(104*BASE_SCALE) },
    lent_egyedul: { w: Math.round(320*BASE_SCALE), h: Math.round(104*BASE_SCALE) },
  }
};
const REF_WIDTH = 800;

function updateDragdropScale() {
  const infEl = document.getElementById('export-target');
  const area  = document.getElementById('dragdrop-area');
  if (!infEl || !area) return;
  area.style.transform = `scale(${infEl.offsetWidth / REF_WIDTH})`;
}

function notifyHeight() {
  const toolbar    = document.getElementById('toolbar');
  const mainLayout = document.getElementById('main-layout');
  if (!toolbar || !mainLayout) return;
  const total = Math.ceil(
    toolbar.getBoundingClientRect().height +
    mainLayout.getBoundingClientRect().height +
    16*2 + 12*3
  ) + 8;
  window.parent.postMessage({ type: 'streamlit:setFrameHeight', height: total }, '*');
}

const IMGS = {
  bal:  { tarolo:'cards/sima_tarolo_bal.png', fent:'cards/sima_fent_bal.png', kozep:'cards/sima_kozep_bal.png', lent:'cards/sima_lent_bal.png', lent_egyedul:'cards/sima_lent_egyedul_bal.png' },
  jobb: { tarolo:'cards/sima_tarolo_jobb.png', fent:'cards/sima_fent_jobb.png', kozep:'cards/sima_kozep_jobb.png', lent:'cards/sima_lent_jobb.png', lent_egyedul:'cards/sima_lent_egyedul_jobb.png' },
  ora:  { egyedul:'cards/ora_egyedul.png', bal:'cards/ora_bal.png', jobb:'cards/ora_jobb.png', mindketto:'cards/ora_mindketto.png' }
};

const CARDS = {
  kg_co2:   { side:'left',  icon:'cards/kg.png',        valueKey:'kg_co2',        labelKey:'kg_co2'   },
  wash:     { side:'left',  icon:'cards/washing.png',   valueKey:'wash',           labelKey:'wash'     },
  bp_paris: { side:'left',  icon:'cards/car.png',       valueKey:'bp_paris_trips', labelKey:'bp_paris' },
  kg_saved: { side:'right', icon:'cards/kg.png',        valueKey:'kg_saved',       labelKey:'kg_saved' },
  kwh:      { side:'right', icon:'cards/light.png',     valueKey:'kwh',            labelKey:'kwh'      },
  house:    { side:'right', icon:'cards/household.png', valueKey:'house',          labelKey:'house'    },
};

let dragged = null;

function getValue(cardId) {
  const key = CARDS[cardId].valueKey;
  const calc = getCurrentCalc();
  const val = calc[key];
  if (val && typeof val === 'object') return val.num || '';
  return val || '';
}

function getUnit(cardId) {
  const key = CARDS[cardId].valueKey;
  const calc = getCurrentCalc();
  const val = calc[key];
  if (val && typeof val === 'object') return val.unit || '';
  return '';
}

function getLabel(cardId) {
  const lk = CARDS[cardId].labelKey;
  const l  = labels[lk];
  if (!l) return '';
  if (lk === 'bp_paris') {
    const calc = getCurrentCalc();
    const trips = calc?.bp_paris_trips_count ?? '';
    return trips ? `${trips} × ${l.route}` : l.route;
  }
  return l.description || '';
}

function updateValues() {
  document.querySelectorAll('[data-card-id]').forEach(el => {
    el.textContent = getValue(el.dataset.cardId);
  });
  document.querySelectorAll('[data-label-id]').forEach(el => {
    el.textContent = getLabel(el.dataset.labelId);
  });
  const calc = getCurrentCalc();
  const redPctStr = calc?.red_pct || '0%';
  document.getElementById('middle-value').textContent = redPctStr;
  document.getElementById('middle-label').textContent = labels['red_pct']?.description || '';
  const redPct = parseFloat(redPctStr);
  const angle = (redPct / 100) * 180 - 90;
  const needle = document.getElementById('needle-line');
  if (needle) needle.style.transform = `rotate(${angle}deg)`;
  updateTexts();
}

function getState(panelId, idx, total) {
  if (total===1) return 'lent_egyedul';
  if (idx===0)   return 'lent';
  if (idx===total-1) return 'fent';
  return 'kozep';
}
function getSide(panelId) { return panelId==='left' ? 'bal' : 'jobb'; }
function getFrom(id) {
  if (panelState.trayLeft.includes(id))  return 'trayLeft';
  if (panelState.trayRight.includes(id)) return 'trayRight';
  if (panelState.left.includes(id))      return 'left';
  if (panelState.right.includes(id))     return 'right';
}
function removeFromState(id, from) { panelState[from] = panelState[from].filter(c => c!==id); }

function render() {
  renderTray('tray-left',  panelState.trayLeft,  'left');
  renderTray('tray-right', panelState.trayRight, 'right');
  renderPanel('left',  panelState.left);
  renderPanel('right', panelState.right);
  updateMiddle();
  updateValues();
  updateDragdropScale();
  setTimeout(notifyHeight, 150);
  sendStateToParent();
}

function renderTray(elId, cards, side) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  [0,1,2].forEach(i => {
    const slot = document.createElement('div');
    slot.className = 'tray-slot' + (cards[i] ? ' has-card' : '');
    if (cards[i]) slot.appendChild(makeCard(cards[i], 'tray'));
    el.appendChild(slot);
  });
  el.ondragover  = e => { e.preventDefault(); el.classList.add('dragover'); };
  el.ondragleave = e => { if (!el.contains(e.relatedTarget)) el.classList.remove('dragover'); };
  el.ondrop = e => {
    e.preventDefault(); el.classList.remove('dragover');
    if (!dragged) return;
    if (CARDS[dragged.id].side !== side) return;
    const trayKey = `tray${side==='left'?'Left':'Right'}`;
    if (panelState[trayKey].includes(dragged.id)) return;
    if (panelState[trayKey].length >= 3) return;
    removeFromState(dragged.id, dragged.from);
    panelState[trayKey].push(dragged.id);
    dragged = null; render();
  };
}

function renderPanel(panelId, cards) {
  const el = document.getElementById(panelId);
  el.innerHTML = '';
  const side  = getSide(panelId);
  const total = cards.length;
  const fullH = DIMS[side].lent.h + DIMS[side].kozep.h + DIMS[side].fent.h;
  el.style.height = `${fullH}px`;
  const emptyHeights = [DIMS[side].lent.h, DIMS[side].kozep.h, DIMS[side].fent.h];

  for (let i = 0; i < 3; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    if (cards[i]) {
      const st  = getState(panelId, i, total);
      const dim = DIMS[side][st];
      slot.style.width  = `${dim.w}px`;
      slot.style.height = `${dim.h}px`;
      slot.appendChild(makeCard(cards[i], panelId, i, total));
    } else {
      slot.classList.add('empty-slot');
      slot.style.width  = `${DIMS[side].fent.w}px`;
      slot.style.height = `${emptyHeights[i]}px`;
    }
    slot.ondragover  = e => { e.preventDefault(); e.stopPropagation(); slot.classList.add('slot-dragover'); };
    slot.ondragleave = e => { if (!slot.contains(e.relatedTarget)) slot.classList.remove('slot-dragover'); };
    slot.ondrop = e => {
      e.preventDefault(); e.stopPropagation(); slot.classList.remove('slot-dragover');
      if (!dragged) return;
      if (CARDS[dragged.id].side !== panelId) return;
      const fromPanel = dragged.from;
      if (fromPanel===panelId) {
        const src=[...panelState[panelId]], si=src.indexOf(dragged.id);
        if (si===i) return;
        src.splice(si,1); src.splice(i,0,dragged.id); panelState[panelId]=src;
      } else {
        if (panelState[panelId].length>=3) return;
        removeFromState(dragged.id, fromPanel);
        panelState[panelId].splice(i,0,dragged.id);
      }
      dragged=null; render();
    };
    el.appendChild(slot);
  }
  el.ondragover  = e => e.preventDefault();
  el.ondrop = e => {
    e.preventDefault();
    if (!dragged||dragged.from===panelId) return;
    if (CARDS[dragged.id].side!==panelId) return;
    if (panelState[panelId].length>=3) return;
    removeFromState(dragged.id, dragged.from);
    panelState[panelId].push(dragged.id);
    dragged=null; render();
  };
}

function makeCard(id, context, idx, total) {
  const card = document.createElement('div');
  card.className = 'card'; card.draggable = true;
  const side = CARDS[id].side==='left' ? 'bal' : 'jobb';
  const bg = document.createElement('img');
  bg.className='card-bg'; bg.crossOrigin='anonymous';

  if (context==='tray') {
    card.style.width='130px'; card.style.height='50px';
    bg.src=IMGS[side].tarolo; card.appendChild(bg);
    const icon=document.createElement('img');
    icon.className='card-icon-tray'; icon.src=CARDS[id].icon; icon.crossOrigin='anonymous';
    card.appendChild(icon);
    const val=document.createElement('span');
    val.className='card-value-tray'; val.dataset.cardId=id; val.textContent=getValue(id);
    card.appendChild(val);
  } else {
    const st=getState(context,idx,total), dim=DIMS[side][st];
    card.style.width=`${dim.w}px`; card.style.height=`${dim.h}px`;
    bg.src=IMGS[side][st]; card.appendChild(bg);
    const icon=document.createElement('img');
    icon.className = id==='house' ? 'card-icon-house' : id==='bp_paris' ? 'card-icon-car' : 'card-icon';
    icon.src=CARDS[id].icon; icon.crossOrigin='anonymous';
    card.appendChild(icon);
    const textBlock = document.createElement('div');
    textBlock.className = 'card-text' + (context==='left' && idx===0 ? ' indent' : '');
    const numRow = document.createElement('div');
    numRow.style.cssText = 'display:flex;align-items:baseline;gap:3px;';
    const numEl = document.createElement('span');
    numEl.className = 'card-number';
    numEl.dataset.cardId = id;
    numEl.textContent = getValue(id);
    numRow.appendChild(numEl);
    const unit = getUnit(id);
    if (unit) {
      const unitEl = document.createElement('span');
      unitEl.className = 'card-unit';
      unitEl.textContent = unit;
      numRow.appendChild(unitEl);
    }
    textBlock.appendChild(numRow);
    const labelText = getLabel(id);
    if (labelText) {
      const labelEl = document.createElement('span');
      labelEl.className = 'card-label';
      labelEl.dataset.labelId = id;
      labelEl.textContent = labelText;
      textBlock.appendChild(labelEl);
    }
    card.appendChild(textBlock);
  }
  card.ondragstart = e => { e.stopPropagation(); dragged={id, from:getFrom(id)}; setTimeout(()=>card.classList.add('dragging'),0); };
  card.ondragend   = () => { card.classList.remove('dragging'); if (dragged){dragged=null; render();} };
  return card;
}

function updateMiddle() {
  const hasL = panelState.left.length>0, hasR = panelState.right.length>0;
  let key = 'egyedul';
  if (hasL && hasR) key='mindketto'; else if (hasL) key='bal'; else if (hasR) key='jobb';
  document.getElementById('middle').src = IMGS.ora[key];
}

function showExportOverlay(msg) {
  document.getElementById('export-msg').textContent = msg;
  document.getElementById('export-overlay').classList.add('visible');
}
function hideExportOverlay() {
  document.getElementById('export-overlay').classList.remove('visible');
}

async function captureCanvas() {
  const emptySlots = document.querySelectorAll('.empty-slot');
  emptySlots.forEach(s => s.classList.add('export-hide'));
  const canvas = await html2canvas(document.getElementById('export-target'), {
    useCORS:true, allowTaint:false, scale:4, backgroundColor:null, logging:false
  });
  emptySlots.forEach(s => s.classList.remove('export-hide'));
  return canvas;
}

function exportTimestamp() {
  const now = new Date();
  return `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
}

async function exportPNG() {
  showExportOverlay('Saving image...');
  try {
    const canvas = await captureCanvas();
    const link = document.createElement('a');
    link.download = `infografika_${exportTimestamp()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) { alert('Export hiba: '+e.message); }
  finally { hideExportOverlay(); }
}

async function exportPDF() {
  showExportOverlay('Saving PDF...');
  try {
    const canvas = await captureCanvas();
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pxToMm = 25.4 / 96;
    const pdfW = canvas.width  * pxToMm;
    const pdfH = canvas.height * pxToMm;
    const pdf = new jsPDF({ orientation: pdfW >= pdfH ? 'landscape' : 'portrait', unit: 'mm', format: [pdfW, pdfH] });
    pdf.addImage(imgData, 'PNG', 0, 0, pdfW, pdfH);
    pdf.save(`infografika_${exportTimestamp()}.pdf`);
  } catch(e) { alert('PDF export hiba: '+e.message); }
  finally { hideExportOverlay(); }
}

buildWebsiteSelector();
buildPagetypeSelector(currentWebsite);
document.getElementById('pv-input').value = formatPVDisplay(currentPV);

const bgImg = document.getElementById('bg-img');
if (bgImg.complete) render(); else bgImg.onload = () => render();

const ro = new ResizeObserver(() => { updateDragdropScale(); setTimeout(notifyHeight, 150); });
ro.observe(document.getElementById('export-target'));
</script>
