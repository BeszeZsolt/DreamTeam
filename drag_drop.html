<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: sans-serif; overflow: hidden; }

.page-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 1285 / 720;
}
.bg-img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
  pointer-events: none;
}
.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
.selector-wrapper {
  position: absolute;
  top: 1%; left: 50%;
  transform: translateX(-50%);
}
.selector-wrapper select {
  background: rgba(0,0,0,0.6);
  color: white;
  border: 2px solid #4CAF50;
  border-radius: 8px;
  cursor: pointer;
  outline: none;
}
.dragdrop-area {
  position: absolute;
  top: 50%; left: 1%;
  display: flex;
  align-items: flex-start;
}
.panel {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.panel-title {
  color: white;
  font-weight: bold;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  white-space: nowrap;
}
.middle-group {
  display: flex;
  align-items: flex-start;
}
.tray {
  background: rgba(0,0,0,0.4);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
}
.tray.dragover { background: rgba(30,90,30,0.6); }
.tray-slot {
  border: 2px dashed #555;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.3);
  overflow: hidden;
}
.panel-slots {
  display: flex;
  flex-direction: column-reverse;
  overflow: visible;
}
.slot {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: visible;
}
.slot.slot-dragover { background: rgba(46,74,46,0.5); }
.card {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  user-select: none;
  position: relative;
  z-index: 1;
  overflow: visible;
}
.card-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: fill;
  pointer-events: none;
}
.card-icon, .card-icon-house, .card-icon-tray {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: auto;
  pointer-events: none;
  object-fit: contain;
}
.card-value, .card-value-indent, .card-value-tray {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-weight: bold;
  pointer-events: none;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
}
.card.dragging { opacity: 0.4; }
.middle-wrapper {
  position: relative;
  display: inline-block;
}
.middle-img { display: block; pointer-events: none; }
.middle-value {
  position: absolute;
  bottom: 22%; left: 45%;
  transform: translateX(-50%);
  color: #f5f500;
  font-weight: bold;
  pointer-events: none;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="page-wrapper">
  <img class="bg-img" src="cards/empty_template.png"/>
  <div class="overlay">
    <div class="selector-wrapper">
      <select id="selector" onchange="onPageChange(this.value)"></select>
    </div>
    <div class="dragdrop-area" id="dragdrop-area">
      <div class="panel" id="panel-tray-left">
        <div class="tray" id="tray-left"></div>
      </div>
      <div class="middle-group" id="middle-group">
        <div class="panel" id="panel-left">
          <div class="panel-slots" id="left"></div>
        </div>
        <div class="panel" id="panel-middle">
          <div class="middle-wrapper" id="middle-wrapper">
            <img id="middle" class="middle-img" src="cards/ora_egyedul.png"/>
            <span class="middle-value" id="middle-value"></span>
          </div>
        </div>
        <div class="panel" id="panel-right">
          <div class="panel-slots" id="right"></div>
        </div>
      </div>
      <div class="panel" id="panel-tray-right">
        <div class="tray" id="tray-right"></div>
      </div>
    </div>
  </div>
</div>

<script>
const ALL_STATS = '{{ALL_STATS}}';
let allStats = {};
let currentPage = '';

try {
  allStats = JSON.parse(ALL_STATS);
  currentPage = Object.keys(allStats)[0];
} catch(e) {}

// ── Méretek ────────────────────────────────────────────────────────────
// Minden w (page-wrapper szélessége) arányában van megadva.
// Ha valami túl nagy/kicsi, csak a szorzót változtatsd.

function getW() {
  return document.querySelector('.page-wrapper').offsetWidth;
}

function getSizes() {
  const w = getW();
  return {
    // Kártyák
    card: {
      bal: {
        tarolo:       { w: w * 0.100, h: w * 0.034 },
        fent:         { w: w * 0.200, h: w * 0.061 },
        kozep:        { w: w * 0.200, h: w * 0.061 },
        lent:         { w: w * 0.225, h: w * 0.067 },
        lent_egyedul: { w: w * 0.225, h: w * 0.067 },
      },
      jobb: {
        tarolo:       { w: w * 0.100, h: w * 0.034 },
        fent:         { w: w * 0.200, h: w * 0.061 },
        kozep:        { w: w * 0.200, h: w * 0.061 },
        lent:         { w: w * 0.200, h: w * 0.067 },
        lent_egyedul: { w: w * 0.200, h: w * 0.067 },
      }
    },
    // Középső óra
    middle:           { w: w * 0.218, h: w * 0.211 },
    // Ikonok
    icon:             { h: w * 0.045, left: w * 0.012 },
    iconHouse:        { h: w * 0.054, left: w * 0.012 },
    iconTray:         { h: w * 0.025, left: w * 0.008 },
    // Betűméretek
    fontSize:         w * 0.016,
    fontSizeTray:     w * 0.014,
    fontSizeMiddle:   w * 0.025,
    // Értékek pozíciója
    valueRight:       w * 0.008,
    valueRightIndent: w * 0.030,
    // Selector
    selectorFont:     w * 0.010,
    selectorPad:      `${w * 0.003}px ${w * 0.009}px`,
    // Layout
    gap:         w * 0.014,
    trayPad:     w * 0.007,
    trayGap:     w * 0.005,
    panelGap:    w * 0.005,
    titleFont:   w * 0.014,
    titleMargin: w * 0.005,
    middlePadTop: w * 0.010,
  };
}

function applyLayoutSizes() {
  const s = getSizes();

  // Dragdrop-area és middle-group gap
  document.getElementById('dragdrop-area').style.gap = `${s.gap}px`;
  document.getElementById('middle-group').style.gap  = `${s.gap}px`;

  // Tray-ok
  ['tray-left', 'tray-right'].forEach(id => {
    const t = document.getElementById(id);
    t.style.padding = `${s.trayPad}px`;
    t.style.gap     = `${s.trayGap}px`;
  });

  // Panelek gap
  ['panel-tray-left', 'panel-left', 'panel-middle', 'panel-right', 'panel-tray-right'].forEach(id => {
    const p = document.getElementById(id);
    if (p) p.style.gap = `${s.panelGap}px`;
  });

  // Panel title-ok
  ['title-tray-left', 'title-left', 'title-right', 'title-tray-right'].forEach(id => {
    const t = document.getElementById(id);
    if (t) {
      t.style.fontSize     = `${s.titleFont}px`;
      t.style.marginBottom = `${s.titleMargin}px`;
    }
  });

  // Selector
  const sel = document.getElementById('selector');
  sel.style.fontSize = `${s.selectorFont}px`;
  sel.style.padding  = s.selectorPad;

  // Középső
  document.getElementById('middle-wrapper').style.paddingTop = `${s.middlePadTop}px`;
  document.getElementById('middle-value').style.fontSize     = `${s.fontSizeMiddle}px`;
}

// ── Segédfüggvények ────────────────────────────────────────────────────

const IMGS = {
  bal: {
    tarolo:       'cards/sima_tarolo_bal.png',
    fent:         'cards/sima_fent_bal.png',
    kozep:        'cards/sima_kozep_bal.png',
    lent:         'cards/sima_lent_bal.png',
    lent_egyedul: 'cards/sima_lent_egyedul_bal.png',
  },
  jobb: {
    tarolo:       'cards/sima_tarolo_jobb.png',
    fent:         'cards/sima_fent_jobb.png',
    kozep:        'cards/sima_kozep_jobb.png',
    lent:         'cards/sima_lent_jobb.png',
    lent_egyedul: 'cards/sima_lent_egyedul_jobb.png',
  },
  ora: {
    egyedul:   'cards/ora_egyedul.png',
    bal:       'cards/ora_bal.png',
    jobb:      'cards/ora_jobb.png',
    mindketto: 'cards/ora_mindketto.png',
  }
};

const CARDS = {
  kg_co2:   { side: 'left',  icon: 'cards/kg.png',        valueKey: 'kg_co2' },
  wash:     { side: 'left',  icon: 'cards/washing.png',   valueKey: 'wash' },
  bp_paris: { side: 'left',  icon: 'cards/car.png',       valueKey: 'bp_paris_trips' },
  kg_saved: { side: 'right', icon: 'cards/kg.png',        valueKey: 'kg_saved' },
  kwh:      { side: 'right', icon: 'cards/light.png',     valueKey: 'kwh' },
  house:    { side: 'right', icon: 'cards/household.png', valueKey: 'house' },
};

let panelState = {
  trayLeft:  ['kg_co2', 'wash', 'bp_paris'],
  trayRight: ['kg_saved', 'kwh', 'house'],
  left:  [],
  right: [],
};

let dragged = null;

function getValue(cardId) {
  const key = CARDS[cardId].valueKey;
  return allStats[currentPage] ? allStats[currentPage][key] : '';
}

function onPageChange(page) {
  currentPage = page;
  updateValues();
}

function buildSelector() {
  const el = document.getElementById('selector');
  el.innerHTML = '';
  Object.keys(allStats).forEach(page => {
    const opt = document.createElement('option');
    opt.value = page;
    opt.textContent = page;
    if (page === currentPage) opt.selected = true;
    el.appendChild(opt);
  });
}

function updateValues() {
  document.querySelectorAll('[data-card-id]').forEach(el => {
    el.textContent = getValue(el.dataset.cardId);
  });
  document.getElementById('middle-value').textContent = allStats[currentPage]?.red_pct || '';
}

function getState(panelId, idx, total) {
  if (total === 1) return 'lent_egyedul';
  if (idx === 0)   return 'lent';
  if (idx === total - 1) return 'fent';
  return 'kozep';
}

function getSlotState(idx) {
  if (idx === 0) return 'lent';
  if (idx === 2) return 'fent';
  return 'kozep';
}

function getSide(panelId) {
  return panelId === 'left' ? 'bal' : 'jobb';
}

function updateMiddle() {
  const hasLeft  = panelState.left.length  > 0;
  const hasRight = panelState.right.length > 0;
  let key = 'egyedul';
  if (hasLeft && hasRight) key = 'mindketto';
  else if (hasLeft)        key = 'bal';
  else if (hasRight)       key = 'jobb';
  const mid = document.getElementById('middle');
  const s = getSizes();
  mid.src = IMGS.ora[key];
  mid.style.width  = `${s.middle.w}px`;
  mid.style.height = `${s.middle.h}px`;
}

function getFrom(id) {
  if (panelState.trayLeft.includes(id))  return 'trayLeft';
  if (panelState.trayRight.includes(id)) return 'trayRight';
  if (panelState.left.includes(id))      return 'left';
  if (panelState.right.includes(id))     return 'right';
}

function removeFromState(id, from) {
  panelState[from] = panelState[from].filter(c => c !== id);
}

// ── Render ─────────────────────────────────────────────────────────────

function render() {
  applyLayoutSizes();
  renderTray('tray-left',  panelState.trayLeft,  'left');
  renderTray('tray-right', panelState.trayRight, 'right');
  renderPanel('left',  panelState.left);
  renderPanel('right', panelState.right);
  updateMiddle();
  updateValues();
}

function renderTray(elId, cards, side) {
  const el = document.getElementById(elId);
  const s = getSizes();
  const sideKey = side === 'left' ? 'bal' : 'jobb';
  const dim = s.card[sideKey].tarolo;
  el.innerHTML = '';

  [0, 1, 2].forEach(i => {
    const slot = document.createElement('div');
    slot.className = 'tray-slot';
    slot.style.width  = `${dim.w}px`;
    slot.style.height = `${dim.h}px`;
    if (cards[i]) slot.appendChild(makeCard(cards[i], 'tray'));
    el.appendChild(slot);
  });

  el.ondragover  = e => { e.preventDefault(); el.classList.add('dragover'); };
  el.ondragleave = e => { if (!el.contains(e.relatedTarget)) el.classList.remove('dragover'); };
  el.ondrop = e => {
    e.preventDefault();
    el.classList.remove('dragover');
    if (!dragged) return;
    if (CARDS[dragged.id].side !== side) return;
    const trayKey = `tray${side === 'left' ? 'Left' : 'Right'}`;
    if (panelState[trayKey].includes(dragged.id)) return;
    if (panelState[trayKey].length >= 3) return;
    removeFromState(dragged.id, dragged.from);
    panelState[trayKey].push(dragged.id);
    dragged = null;
    render();
  };
}

function renderPanel(panelId, cards) {
  const el = document.getElementById(panelId);
  el.innerHTML = '';
  const side = getSide(panelId);
  const total = cards.length;
  const s = getSizes();
  const DIMS = s.card[side];

  const panelH = DIMS.lent.h + DIMS.kozep.h + DIMS.fent.h;
  const panelW = DIMS.fent.w;
  el.style.width  = `${panelW}px`;
  el.style.height = `${panelH}px`;

  for (let i = 0; i < 3; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';

    if (cards[i]) {
      const st  = getState(panelId, i, total);
      const dim = DIMS[st];
      slot.style.width  = `${dim.w}px`;
      slot.style.height = `${dim.h}px`;
      slot.appendChild(makeCard(cards[i], panelId, i, total));
    } else {
      const emptyDim = DIMS[getSlotState(i)];
      slot.style.width        = `${emptyDim.w}px`;
      slot.style.height       = `${emptyDim.h}px`;
      slot.style.background   = 'rgba(51,51,51,0.6)';
      slot.style.borderRadius = '6px';
    }

    slot.ondragover  = e => { e.preventDefault(); e.stopPropagation(); slot.classList.add('slot-dragover'); };
    slot.ondragleave = e => { if (!slot.contains(e.relatedTarget)) slot.classList.remove('slot-dragover'); };
    slot.ondrop = e => {
      e.preventDefault();
      e.stopPropagation();
      slot.classList.remove('slot-dragover');
      if (!dragged) return;
      if (CARDS[dragged.id].side !== panelId) return;
      const fromPanel = dragged.from;
      if (fromPanel === panelId) {
        const sourceIdx = panelState[panelId].indexOf(dragged.id);
        if (sourceIdx === i) return;
        const newCards = [...panelState[panelId]];
        newCards.splice(sourceIdx, 1);
        newCards.splice(i, 0, dragged.id);
        panelState[panelId] = newCards;
      } else {
        if (panelState[panelId].length >= 3) return;
        removeFromState(dragged.id, fromPanel);
        panelState[panelId].splice(i, 0, dragged.id);
      }
      dragged = null;
      render();
    };

    el.appendChild(slot);
  }

  el.ondragover  = e => e.preventDefault();
  el.ondragleave = e => { if (!el.contains(e.relatedTarget)) el.classList.remove('dragover'); };
  el.ondrop = e => {
    e.preventDefault();
    if (!dragged) return;
    if (dragged.from === panelId) return;
    if (CARDS[dragged.id].side !== panelId) return;
    if (panelState[panelId].length >= 3) return;
    removeFromState(dragged.id, dragged.from);
    panelState[panelId].push(dragged.id);
    dragged = null;
    render();
  };
}

// ── Kártya gyártás ─────────────────────────────────────────────────────

function makeCard(id, context, idx, total) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  const side = CARDS[id].side === 'left' ? 'bal' : 'jobb';
  const s = getSizes();
  const DIMS = s.card[side];

  const bg = document.createElement('img');
  bg.className = 'card-bg';

  if (context === 'tray') {
    const dim = DIMS.tarolo;
    card.style.width  = `${dim.w}px`;
    card.style.height = `${dim.h}px`;
    bg.src = IMGS[side].tarolo;
    card.appendChild(bg);

    const icon = document.createElement('img');
    icon.className    = 'card-icon-tray';
    icon.style.height = `${s.iconTray.h}px`;
    icon.style.left   = `${s.iconTray.left}px`;
    icon.src = CARDS[id].icon;
    card.appendChild(icon);

    const value = document.createElement('span');
    value.className      = 'card-value-tray';
    value.style.fontSize = `${s.fontSizeTray}px`;
    value.style.right    = `${s.valueRight}px`;
    value.dataset.cardId = id;
    value.textContent    = getValue(id);
    card.appendChild(value);

  } else {
    const st  = getState(context, idx, total);
    const dim = DIMS[st];
    card.style.width  = `${dim.w}px`;
    card.style.height = `${dim.h}px`;
    bg.src = IMGS[side][st];
    card.appendChild(bg);

    const isHouse  = id === 'house';
    const icon = document.createElement('img');
    icon.className    = isHouse ? 'card-icon-house' : 'card-icon';
    icon.style.height = isHouse ? `${s.iconHouse.h}px` : `${s.icon.h}px`;
    icon.style.left   = isHouse ? `${s.iconHouse.left}px` : `${s.icon.left}px`;
    icon.src = CARDS[id].icon;
    card.appendChild(icon);

    const isIndent = (context === 'left' && idx === 0);
    const value = document.createElement('span');
    value.className      = isIndent ? 'card-value-indent' : 'card-value';
    value.style.fontSize = `${s.fontSize}px`;
    value.style.right    = isIndent ? `${s.valueRightIndent}px` : `${s.valueRight}px`;
    value.dataset.cardId = id;
    value.textContent    = getValue(id);
    card.appendChild(value);
  }

  card.ondragstart = e => {
    e.stopPropagation();
    dragged = { id, from: getFrom(id) };
    setTimeout(() => card.classList.add('dragging'), 0);
  };
  card.ondragend = () => {
    card.classList.remove('dragging');
    if (dragged) { dragged = null; render(); }
  };

  return card;
}

// ── Init ───────────────────────────────────────────────────────────────

function resizeHandler() {
  render();
  const h = document.querySelector('.page-wrapper').getBoundingClientRect().height;
  window.parent.postMessage({ type: 'streamlit:setFrameHeight', height: h }, '*');
}

window.addEventListener('resize', resizeHandler);
buildSelector();
resizeHandler();
</script>
</body>
</html>
