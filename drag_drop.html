<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: sans-serif;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }

  .container { display: flex; gap: 20px; align-items: flex-start; justify-content: center; }
  .panel { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .panel-title { color: white; font-weight: bold; margin-bottom: 8px; }

  .middle-group {
    display: flex;
    gap: 0;
    align-items: flex-start;
  }

  .tray {
    background: #2a2a2a;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 140px;
    box-sizing: border-box;
  }

  .tray.dragover { background: #1e3a1e; }

  .tray-slot {
    width: auto;
    border: 2px dashed #555;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2a2a;
    box-sizing: border-box;
    overflow: hidden;
    padding: 4px;
  }

  .panel-slots {
    display: flex;
    flex-direction: column-reverse;
    background: transparent;
    overflow: visible;
    box-sizing: border-box;
  }

  .slot {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: visible;
  }

  .slot.slot-dragover { background: #2e4a2e; }

  .card {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    user-select: none;
    position: relative;
    z-index: 1;
    box-sizing: border-box;
    overflow: visible;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    pointer-events: none;
  }

  .card.dragging { opacity: 0.4; }

  .middle-img {
    display: block;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="panel-title">Tároló</div>
    <div class="tray" id="tray-left"></div>
  </div>

  <div class="middle-group">
    <div class="panel">
      <div class="panel-title">Bal panel</div>
      <div class="panel-slots" id="left" style="width:265px; height:231px;"></div>
    </div>
    <div class="panel">
      <img id="middle" class="middle-img" style="padding-top:16.5px; height:247px; width:256px;" src="cards/ora_egyedul.png"/>
    </div>
    <div class="panel">
      <div class="panel-title">Jobb panel</div>
      <div class="panel-slots" id="right" style="width:240px; height:231px;"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Tároló</div>
    <div class="tray" id="tray-right"></div>
  </div>
</div>

<script>
  const SCALE = 0.75;

  const IMGS = {
    bal: {
      tarolo:       'cards/sima_tarolo_bal.png',
      fent:         'cards/sima_fent_bal.png',
      kozep:        'cards/sima_kozep_bal.png',
      lent:         'cards/sima_lent_bal.png',
      lent_egyedul: 'cards/sima_lent_egyedul_bal.png',
    },
    jobb: {
      tarolo:       'cards/sima_tarolo_jobb.png',
      fent:         'cards/sima_fent_jobb.png',
      kozep:        'cards/sima_kozep_jobb.png',
      lent:         'cards/sima_lent_jobb.png',
      lent_egyedul: 'cards/sima_lent_egyedul_jobb.png',
    },
    ora: {
      egyedul:   'cards/ora_egyedul.png',
      bal:       'cards/ora_bal.png',
      jobb:      'cards/ora_jobb.png',
      mindketto: 'cards/ora_mindketto.png',
    }
  };

  const DIMS = {
    bal: {
      tarolo:       { w: 120, h: 39 },
      fent:         { w: Math.round(320 * SCALE), h: Math.round(97  * SCALE) },
      kozep:        { w: Math.round(320 * SCALE), h: Math.round(97  * SCALE) },
      lent:         { w: Math.round(353 * SCALE), h: Math.round(104 * SCALE) },
      lent_egyedul: { w: Math.round(353 * SCALE), h: Math.round(104 * SCALE) },
    },
    jobb: {
      tarolo:       { w: 120, h: 39 },
      fent:         { w: Math.round(320 * SCALE), h: Math.round(97  * SCALE) },
      kozep:        { w: Math.round(320 * SCALE), h: Math.round(97  * SCALE) },
      lent:         { w: Math.round(320 * SCALE), h: Math.round(104 * SCALE) },
      lent_egyedul: { w: Math.round(320 * SCALE), h: Math.round(104 * SCALE) },
    }
  };

  const PANEL_H = Math.round(308 * SCALE);

  const CARDS = {
    kg_co2:   { side: 'left'  },
    wash:     { side: 'left'  },
    bp_paris: { side: 'left'  },
    kg_saved: { side: 'right' },
    kwh:      { side: 'right' },
    house:    { side: 'right' },
  };

  let state = {
    trayLeft:  ['kg_co2', 'wash', 'bp_paris'],
    trayRight: ['kg_saved', 'kwh', 'house'],
    left:  [],
    right: [],
  };

  let dragged = null;

  function getState(panelId, idx, total) {
    if (total === 1) return 'lent_egyedul';
    if (idx === 0) return 'lent';
    if (idx === total - 1) return 'fent';
    return 'kozep';
  }

  function getSide(panelId) {
    return panelId === 'left' ? 'bal' : 'jobb';
  }

  function updateMiddle() {
    const hasLeft  = state.left.length > 0;
    const hasRight = state.right.length > 0;
    let key = 'egyedul';
    if (hasLeft && hasRight) key = 'mindketto';
    else if (hasLeft) key = 'bal';
    else if (hasRight) key = 'jobb';
    document.getElementById('middle').src = IMGS.ora[key];
  }

  function render() {
    renderTray('tray-left', state.trayLeft, 'left');
    renderTray('tray-right', state.trayRight, 'right');
    renderPanel('left', state.left);
    renderPanel('right', state.right);
    updateMiddle();
  }

  function renderTray(elId, cards, side) {
    const el = document.getElementById(elId);
    el.innerHTML = '';
    [0, 1, 2].forEach(i => {
      const slot = document.createElement('div');
      slot.className = 'tray-slot';
      if (cards[i]) {
        const card = makeCard(cards[i], 'tray');
        slot.appendChild(card);
      } else {
        slot.style.height = '47px';
      }
      el.appendChild(slot);
    });

    el.ondragover = e => {
      e.preventDefault();
      el.classList.add('dragover');
    };
    el.ondragleave = e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('dragover');
    };
    el.ondrop = e => {
      e.preventDefault();
      el.classList.remove('dragover');
      if (!dragged) return;
      if (CARDS[dragged.id].side !== side) return;
      const trayKey = `tray${side === 'left' ? 'Left' : 'Right'}`;
      if (state[trayKey].includes(dragged.id)) return;
      if (state[trayKey].length >= 3) return;
      removeFromState(dragged.id, dragged.from);
      state[trayKey].push(dragged.id);
      dragged = null;
      render();
    };
  }

  function renderPanel(panelId, cards) {
    const el = document.getElementById(panelId);
    el.innerHTML = '';
    const side = getSide(panelId);
    const total = cards.length;

    const filledH = cards.reduce((sum, id, i) => {
      const st = getState(panelId, i, total);
      return sum + DIMS[side][st].h;
    }, 0);
    const emptySlots = 3 - total;
    const emptyH = emptySlots > 0 ? Math.floor((PANEL_H - filledH) / emptySlots) : 0;

    for (let i = 0; i < 3; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';

      if (cards[i]) {
        const st = getState(panelId, i, total);
        const dim = DIMS[side][st];
        slot.style.width = `${dim.w}px`;
        slot.style.height = `${dim.h}px`;
        slot.appendChild(makeCard(cards[i], panelId, i, total));
      } else {
        slot.style.width = `${DIMS[side].fent.w}px`;
        slot.style.height = `${emptyH}px`;
        slot.style.background = '#333';
        slot.style.borderRadius = '6px';
      }

      slot.ondragover = e => {
        e.preventDefault();
        e.stopPropagation();
        slot.classList.add('slot-dragover');
      };
      slot.ondragleave = e => {
        if (!slot.contains(e.relatedTarget)) slot.classList.remove('slot-dragover');
      };
      slot.ondrop = e => {
        e.preventDefault();
        e.stopPropagation();
        slot.classList.remove('slot-dragover');
        if (!dragged) return;
        if (CARDS[dragged.id].side !== panelId) return;
        const fromPanel = dragged.from;
        if (fromPanel === panelId) {
          const sourceIdx = state[panelId].indexOf(dragged.id);
          if (sourceIdx === i) return;
          const newCards = [...state[panelId]];
          newCards.splice(sourceIdx, 1);
          newCards.splice(i, 0, dragged.id);
          state[panelId] = newCards;
        } else {
          if (state[panelId].length >= 3) return;
          removeFromState(dragged.id, fromPanel);
          state[panelId].splice(i, 0, dragged.id);
        }
        dragged = null;
        render();
      };

      el.appendChild(slot);
    }

    el.ondragover = e => e.preventDefault();
    el.ondragleave = e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('dragover');
    };
    el.ondrop = e => {
      e.preventDefault();
      if (!dragged) return;
      if (dragged.from === panelId) return;
      if (CARDS[dragged.id].side !== panelId) return;
      if (state[panelId].length >= 3) return;
      removeFromState(dragged.id, dragged.from);
      state[panelId].push(dragged.id);
      dragged = null;
      render();
    };
  }

  function makeCard(id, context, idx, total) {
    const card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;

    const img = document.createElement('img');
    const side = CARDS[id].side === 'left' ? 'bal' : 'jobb';

    if (context === 'tray') {
      card.style.width = '120px';
      card.style.height = '39px';
      img.src = IMGS[side].tarolo;
    } else {
      const st = getState(context, idx, total);
      const dim = DIMS[side][st];
      card.style.width = `${dim.w}px`;
      card.style.height = `${dim.h}px`;
      img.src = IMGS[side][st];
    }

    card.appendChild(img);

    card.ondragstart = e => {
      e.stopPropagation();
      dragged = { id, from: getFrom(id) };
      setTimeout(() => card.classList.add('dragging'), 0);
    };
    card.ondragend = () => {
      card.classList.remove('dragging');
      if (dragged) { dragged = null; render(); }
    };
    return card;
  }

  function getFrom(id) {
    if (state.trayLeft.includes(id)) return 'trayLeft';
    if (state.trayRight.includes(id)) return 'trayRight';
    if (state.left.includes(id)) return 'left';
    if (state.right.includes(id)) return 'right';
  }

  function removeFromState(id, from) {
    state[from] = state[from].filter(c => c !== id);
  }

  render();
</script>
</body>
</html>
