<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: sans-serif;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }

  .container { display: flex; gap: 30px; align-items: center; justify-content: center; }
  .panel { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .panel-title { color: white; font-weight: bold; margin-bottom: 8px; }

  .middle {
    width: 120px;
    height: 165px;
    background: #3a3a3a;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 12px;
    text-align: center;
    padding: 10px;
    position: relative;
    box-sizing: border-box;
  }

  .middle.right-tab::after {
    content: '';
    position: absolute;
    right: -12px;
    bottom: 20px;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 12px solid #4CAF50;
  }

  .tray {
    background: #2a2a2a;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 160px;
  }

  .tray.dragover { background: #1e3a1e; }

  .tray-slot {
    width: 160px;
    height: 55px;
    border: 2px dashed #555;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2a2a;
    box-sizing: border-box;
  }

  .panel-slots {
    display: flex;
    flex-direction: column-reverse;
    width: 160px;
    height: 165px;
    border-radius: 10px;
    background: #2a2a2a;
    overflow: visible;
    box-sizing: border-box;
  }

  .panel-slots.dragover { background: #1e3a1e; }

  .slot {
    width: 160px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: visible;
  }

  .slot.slot-dragover { background: #2e4a2e; }

  .card {
    width: 160px;
    height: 55px;
    background: #4CAF50;
    border: 2px solid #2d7a2d;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    cursor: grab;
    user-select: none;
    position: relative;
    z-index: 1;
    box-sizing: border-box;
    overflow: visible;
  }

  .card.dragging { opacity: 0.4; }

  .card.right-tab::after {
    content: '';
    position: absolute;
    right: -12px;
    top: 50%;
    transform: translateY(-50%);
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 12px solid #4CAF50;
    z-index: 2;
  }

  .card.notch::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 10px solid #2d7a2d;
    z-index: 2;
  }

  .empty-slot {
    width: 160px;
    height: 55px;
    background: transparent;
  }
</style>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="panel-title">Tároló</div>
    <div class="tray" id="tray-left"></div>
  </div>
  <div class="panel">
    <div class="panel-title">Bal panel</div>
    <div class="panel-slots" id="left"></div>
  </div>
  <div class="panel">
    <div class="panel-title">Középső</div>
    <div class="middle" id="middle">Mérőóra</div>
  </div>
  <div class="panel">
    <div class="panel-title">Jobb panel</div>
    <div class="panel-slots" id="right"></div>
  </div>
  <div class="panel">
    <div class="panel-title">Tároló</div>
    <div class="tray" id="tray-right"></div>
  </div>
</div>

<script>
  const CARDS = {
    kg_co2:   { label: 'KG CO2',          side: 'left'  },
    wash:     { label: 'Mosás',            side: 'left'  },
    bp_paris: { label: 'BP→Párizs',        side: 'left'  },
    kg_saved: { label: 'KG Megtakarítás', side: 'right' },
    kwh:      { label: 'kWh',             side: 'right' },
    house:    { label: 'Háztartás',       side: 'right' },
  };

  let state = {
    trayLeft:  ['kg_co2', 'wash', 'bp_paris'],
    trayRight: ['kg_saved', 'kwh', 'house'],
    left:  [],
    right: [],
  };

  let dragged = null;

  function render() {
    renderTray('tray-left', state.trayLeft, 'left');
    renderTray('tray-right', state.trayRight, 'right');
    renderPanel('left', state.left);
    renderPanel('right', state.right);
    updateMiddle();
  }

  function updateMiddle() {
    const middle = document.getElementById('middle');
    middle.classList.toggle('right-tab', state.right.length > 0);
  }

  function renderTray(elId, cards, side) {
    const el = document.getElementById(elId);
    el.innerHTML = '';
    [0, 1, 2].forEach(i => {
      const slot = document.createElement('div');
      slot.className = 'tray-slot';
      if (cards[i]) slot.appendChild(makeCard(cards[i], 'tray'));
      el.appendChild(slot);
    });

    el.ondragover = e => {
      e.preventDefault();
      el.classList.add('dragover');
    };
    el.ondragleave = e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('dragover');
    };
    el.ondrop = e => {
      e.preventDefault();
      el.classList.remove('dragover');
      if (!dragged) return;
      if (CARDS[dragged.id].side !== side) return;
      const trayKey = `tray${side === 'left' ? 'Left' : 'Right'}`;
      if (state[trayKey].includes(dragged.id)) return;
      if (state[trayKey].length >= 3) return;
      removeFromState(dragged.id, dragged.from);
      state[trayKey].push(dragged.id);
      dragged = null;
      render();
    };
  }

  function renderPanel(panelId, cards) {
    const el = document.getElementById(panelId);
    el.innerHTML = '';

    for (let i = 0; i < 3; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';

      if (cards[i]) {
        slot.appendChild(makeCard(cards[i], panelId, i));
      } else {
        const empty = document.createElement('div');
        empty.className = 'empty-slot';
        slot.appendChild(empty);
      }

      slot.ondragover = e => {
        e.preventDefault();
        e.stopPropagation();
        slot.classList.add('slot-dragover');
      };
      slot.ondragleave = () => slot.classList.remove('slot-dragover');
      slot.ondrop = e => {
        e.preventDefault();
        e.stopPropagation();
        slot.classList.remove('slot-dragover');
        if (!dragged) return;
        if (CARDS[dragged.id].side !== panelId) return;
        const fromPanel = dragged.from;
        if (fromPanel === panelId) {
          const sourceIdx = state[panelId].indexOf(dragged.id);
          if (sourceIdx === i) return;
          const newCards = [...state[panelId]];
          newCards.splice(sourceIdx, 1);
          newCards.splice(i, 0, dragged.id);
          state[panelId] = newCards;
        } else {
          if (state[panelId].length >= 3) return;
          removeFromState(dragged.id, fromPanel);
          state[panelId].splice(i, 0, dragged.id);
        }
        dragged = null;
        render();
      };

      el.appendChild(slot);
    }

    el.ondragover = e => {
      e.preventDefault();
      el.classList.add('dragover');
    };
    el.ondragleave = e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('dragover');
    };
    el.ondrop = e => {
      e.preventDefault();
      el.classList.remove('dragover');
      if (!dragged) return;
      if (dragged.from === panelId) return;
      if (CARDS[dragged.id].side !== panelId) return;
      if (state[panelId].length >= 3) return;
      removeFromState(dragged.id, dragged.from);
      state[panelId].push(dragged.id);
      dragged = null;
      render();
    };
  }

  function makeCard(id, context, idx) {
    const card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.textContent = CARDS[id].label;

    if (context === 'left' && idx === 0) {
      card.classList.add('right-tab');
    } else if ((context === 'left' || context === 'right') && idx > 0) {
      card.classList.add('notch');
    }

    card.ondragstart = e => {
      e.stopPropagation();
      dragged = { id, from: getFrom(id) };
      setTimeout(() => card.classList.add('dragging'), 0);
    };
    card.ondragend = () => {
      card.classList.remove('dragging');
      if (dragged) { dragged = null; render(); }
    };
    return card;
  }

  function getFrom(id) {
    if (state.trayLeft.includes(id)) return 'trayLeft';
    if (state.trayRight.includes(id)) return 'trayRight';
    if (state.left.includes(id)) return 'left';
    if (state.right.includes(id)) return 'right';
  }

  function removeFromState(id, from) {
    state[from] = state[from].filter(c => c !== id);
  }

  render();
</script>
</body>
</html>
