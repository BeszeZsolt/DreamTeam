<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: sans-serif;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }

  .container { display: flex; gap: 30px; align-items: flex-start; justify-content: center; }
  .panel { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .panel-title { color: white; font-weight: bold; margin-bottom: 8px; }

  .middle {
    width: 120px;
    height: 362px;
    background: #3a3a3a;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 12px;
    text-align: center;
    padding: 10px;
    position: relative;
    box-sizing: border-box;
  }

  .tray {
    background: #2a2a2a;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 180px;
    height: 280px;
    box-sizing: border-box;
  }

  .tray.dragover { background: #1e3a1e; }

  .tray-slot {
    width: 160px;
    border: 2px dashed #555;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2a2a;
    box-sizing: border-box;
    overflow: hidden;
  }

  .left-slots {
    display: flex;
    flex-direction: column-reverse;
    width: 386px;
    height: 362px;
    border-radius: 10px;
    background: #2a2a2a;
    overflow: visible;
    box-sizing: border-box;
  }

  .right-slots {
    display: flex;
    flex-direction: column-reverse;
    width: 320px;
    height: 362px;
    border-radius: 10px;
    background: #2a2a2a;
    overflow: visible;
    box-sizing: border-box;
  }

  .slot {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: visible;
  }

  .slot.slot-dragover { background: #2e4a2e; }

  .card {
    background: transparent;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    user-select: none;
    position: relative;
    z-index: 1;
    box-sizing: border-box;
    overflow: visible;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 4px;
    display: block;
    pointer-events: none;
  }

  .card.dragging { opacity: 0.4; }
</style>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="panel-title">Tároló</div>
    <div class="tray" id="tray-left"></div>
  </div>
  <div class="panel">
    <div class="panel-title">Bal panel</div>
    <div class="left-slots panel-slots" id="left"></div>
  </div>
  <div class="panel">
    <div class="panel-title">Középső</div>
    <div class="middle" id="middle">Mérőóra</div>
  </div>
  <div class="panel">
    <div class="panel-title">Jobb panel</div>
    <div class="right-slots panel-slots" id="right"></div>
  </div>
  <div class="panel">
    <div class="panel-title">Tároló</div>
    <div class="tray" id="tray-right"></div>
  </div>
</div>

<script>
  const SLOT_W      = 320;
  const SLOT_W_LENT = 386;
  const PANEL_H     = 362;

  const CARDS = {
    kg_co2:   { side: 'left',  h: 118, img_normal: 'cards/balkg.png',        img_lent: 'cards/balkg_lent.png'        },
    wash:     { side: 'left',  h: 130, img_normal: 'cards/balmosas.png',     img_lent: 'cards/balmosas_lent.png'     },
    bp_paris: { side: 'left',  h: 114, img_normal: 'cards/balkocsi.png',     img_lent: 'cards/balkocsi_lent.png'     },
    kg_saved: { side: 'right', h: 118, img_normal: 'cards/jobbkg.png',       img_lent: 'cards/jobbkg_lent.png'       },
    kwh:      { side: 'right', h: 129, img_normal: 'cards/jobbvillany.png',  img_lent: 'cards/jobbvillany_lent.png'  },
    house:    { side: 'right', h: 112, img_normal: 'cards/jobbcsalad.png',   img_lent: 'cards/jobbcsalad_lent.png'   },
  };

  let state = {
    trayLeft:  ['kg_co2', 'wash', 'bp_paris'],
    trayRight: ['kg_saved', 'kwh', 'house'],
    left:  [],
    right: [],
  };

  let dragged = null;

  function render() {
    renderTray('tray-left', state.trayLeft, 'left');
    renderTray('tray-right', state.trayRight, 'right');
    renderPanel('left', state.left);
    renderPanel('right', state.right);
  }

  function renderTray(elId, cards, side) {
    const el = document.getElementById(elId);
    el.innerHTML = '';
    [0, 1, 2].forEach(i => {
      const slot = document.createElement('div');
      slot.className = 'tray-slot';
      if (cards[i]) {
        const card = makeCard(cards[i], 'tray');
        slot.style.height = card.style.height;
        slot.appendChild(card);
      } else {
        slot.style.height = '60px';
      }
      el.appendChild(slot);
    });

    el.ondragover = e => {
      e.preventDefault();
      el.classList.add('dragover');
    };
    el.ondragleave = e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('dragover');
    };
    el.ondrop = e => {
      e.preventDefault();
      el.classList.remove('dragover');
      if (!dragged) return;
      if (CARDS[dragged.id].side !== side) return;
      const trayKey = `tray${side === 'left' ? 'Left' : 'Right'}`;
      if (state[trayKey].includes(dragged.id)) return;
      if (state[trayKey].length >= 3) return;
      removeFromState(dragged.id, dragged.from);
      state[trayKey].push(dragged.id);
      dragged = null;
      render();
    };
  }

  function renderPanel(panelId, cards) {
    const el = document.getElementById(panelId);
    el.innerHTML = '';

    const filledH = cards.reduce((sum, id) => sum + (id ? CARDS[id].h : 0), 0);
    const emptySlots = 3 - cards.length;
    const emptyH = emptySlots > 0 ? Math.floor((PANEL_H - filledH) / emptySlots) : 0;

    for (let i = 0; i < 3; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';

      if (cards[i]) {
        const isLent = i === 0;
        const w = (panelId === 'left' && isLent) ? SLOT_W_LENT : SLOT_W;
        const h = CARDS[cards[i]].h;
        slot.style.width = `${w}px`;
        slot.style.height = `${h}px`;
        slot.appendChild(makeCard(cards[i], panelId, i));
      } else {
        slot.style.width = `${SLOT_W}px`;
        slot.style.height = `${emptyH}px`;
        slot.style.background = '#333';
        slot.style.borderRadius = '6px';
      }

      slot.ondragover = e => {
        e.preventDefault();
        e.stopPropagation();
        slot.classList.add('slot-dragover');
      };
      slot.ondragleave = e => {
        if (!slot.contains(e.relatedTarget)) slot.classList.remove('slot-dragover');
      };
      slot.ondrop = e => {
        e.preventDefault();
        e.stopPropagation();
        slot.classList.remove('slot-dragover');
        if (!dragged) return;
        if (CARDS[dragged.id].side !== panelId) return;
        const fromPanel = dragged.from;
        if (fromPanel === panelId) {
          const sourceIdx = state[panelId].indexOf(dragged.id);
          if (sourceIdx === i) return;
          const newCards = [...state[panelId]];
          newCards.splice(sourceIdx, 1);
          newCards.splice(i, 0, dragged.id);
          state[panelId] = newCards;
        } else {
          if (state[panelId].length >= 3) return;
          removeFromState(dragged.id, fromPanel);
          state[panelId].splice(i, 0, dragged.id);
        }
        dragged = null;
        render();
      };

      el.appendChild(slot);
    }

    el.ondragover = e => e.preventDefault();
    el.ondragleave = e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('dragover');
    };
    el.ondrop = e => {
      e.preventDefault();
      el.classList.remove('dragover');
      if (!dragged) return;
      if (dragged.from === panelId) return;
      if (CARDS[dragged.id].side !== panelId) return;
      if (state[panelId].length >= 3) return;
      removeFromState(dragged.id, dragged.from);
      state[panelId].push(dragged.id);
      dragged = null;
      render();
    };
  }

  function makeCard(id, context, idx) {
    const card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;

    const img = document.createElement('img');

    if (context === 'tray') {
      const trayW = 156;
      const trayH = Math.round(CARDS[id].h * (trayW / SLOT_W));
      card.style.width = `${trayW}px`;
      card.style.height = `${trayH}px`;
      img.src = CARDS[id].img_normal;
    } else {
      const isLent = idx === 0;
      const w = (context === 'left' && isLent) ? SLOT_W_LENT : SLOT_W;
      card.style.width = `${w}px`;
      card.style.height = `${CARDS[id].h}px`;
      img.src = isLent ? CARDS[id].img_lent : CARDS[id].img_normal;
    }

    card.appendChild(img);

    card.ondragstart = e => {
      e.stopPropagation();
      dragged = { id, from: getFrom(id) };
      setTimeout(() => card.classList.add('dragging'), 0);
    };
    card.ondragend = () => {
      card.classList.remove('dragging');
      if (dragged) { dragged = null; render(); }
    };
    return card;
  }

  function getFrom(id) {
    if (state.trayLeft.includes(id)) return 'trayLeft';
    if (state.trayRight.includes(id)) return 'trayRight';
    if (state.left.includes(id)) return 'left';
    if (state.right.includes(id)) return 'right';
  }

  function removeFromState(id, from) {
    state[from] = state[from].filter(c => c !== id);
  }

  render();
</script>
</body>
</html>
