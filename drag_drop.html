<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
html { min-width: 600px; }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow', 'Segoe UI', sans-serif;
  background: #f5f2ec;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  gap: 12px;
}

.toolbar {
  width: 100%;
  max-width: 1200px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #eae6de;
  border: 1px solid #c8bfa8;
  border-radius: 12px;
  padding: 10px 18px;
  flex-wrap: wrap;
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 200px;
}
.toolbar-label {
  color: #3a4a3a;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.toolbar select {
  background: #f5f2ec;
  color: #2d3a2d;
  border: 1px solid #c8bfa8;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  outline: none;
  flex: 1;
}
.toolbar select:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.toolbar-group-pv {
  flex: 0 0 auto;
  min-width: unset;
}
.pv-input {
  background: #f5f2ec;
  color: #2d3a2d;
  border: 1px solid #c8bfa8;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  outline: none;
  width: 150px;
  text-align: right;
  font-family: 'Barlow', 'Segoe UI', sans-serif;
}
.pv-input:focus {
  border-color: #5a7a5a;
  background: #fff;
}

.main-layout {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  width: 100%;
  max-width: 1200px;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 140px;
  flex-shrink: 0;
  padding-top: 4px;
}
.sidebar-title {
  color: #3a4a3a;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  text-align: center;
  margin-bottom: 4px;
}
.tray {
  background: #eae6de;
  border: 1px solid #c8bfa8;
  border-radius: 10px;
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tray.dragover {
  background: #d4ddd4;
  border-color: #5a7a5a;
}
.tray-slot {
  width: 130px;
  height: 50px;
  border: 1.5px dashed #c8bfa8;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: rgba(245,242,236,0.6);
  transition: background 0.15s;
}
.tray-slot.has-card {
  border-style: solid;
  border-color: transparent;
  background: transparent;
}

.infographic-wrapper {
  flex: 1;
  position: relative;
  min-width: 500px;
}
#export-target {
  position: relative;
  width: 100%;
  border-radius: 8px;
  outline: 3px solid #c8bfa8;
}
.bg-img {
  width: 100%;
  display: block;
  border-radius: 8px;
}
.overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

/* ── Infografika szöveg overlay-ek ── */
.infog-filter-label {
  position: absolute;
  pointer-events: none;
  display: flex;
  align-items: center;
  overflow: hidden;
  font-family: 'Barlow Condensed', 'Segoe UI', sans-serif;
  top: 0; left: 7%; right: 0; height: 13%;
  justify-content: flex-start;
  color: #2d5a1b;
  font-weight: 700;
  font-size: 1.8vw;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  z-index: 10;
}
.infog-subtitle {
  position: absolute;
  pointer-events: none;
  display: flex;
  align-items: center;
  overflow: hidden;
  font-family: 'Barlow Condensed', 'Segoe UI', sans-serif;
  top: 13%; left: 11%; right: 25%; height: 5.5%;
  color: white;
  font-weight: 600;
  font-size: 0.95vw;
  z-index: 10;
}
.infog-pv-label {
  position: absolute;
  pointer-events: none;
  display: flex;
  align-items: center;
  overflow: hidden;
  font-family: 'Barlow Condensed', 'Segoe UI', sans-serif;
  top: 44.8%; left: 8%; right: 27%; height: 6.6%;
  justify-content: flex-start;
  color: white;
  font-weight: 600;
  font-size: 1.05vw;
  white-space: normal;
  z-index: 10;
}

.export-bar {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px;
}
.export-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 18px;
  border-radius: 8px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}
.export-btn:hover  { opacity: 0.85; transform: translateY(-1px); }
.export-btn:active { transform: translateY(0); }
.export-btn.png { background: #5a7a5a; color: #fff; }
.export-btn.pdf { background: #7a5a3a; color: #fff; }
.export-btn svg { flex-shrink: 0; }

.dragdrop-area {
  position: absolute;
  top: 51.5%;
  left: 4.5%;
  transform-origin: top left;
  display: flex;
  align-items: flex-start;
  pointer-events: all;
}
.panel {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.panel-slots {
  display: flex;
  flex-direction: column-reverse;
  justify-content: flex-end;
  background: transparent;
  overflow: visible;
}
.panel-side { margin-top: 18px; }
.slot {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: visible;
  transition: background 0.15s;
}
.slot.slot-dragover {
  background: rgba(90,122,90,0.15);
  border-radius: 6px;
}
.empty-slot {
  background: rgba(200,191,168,0.3);
  border-radius: 6px;
}
.export-hide { visibility: hidden; }

.card {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  user-select: none;
  position: relative;
  z-index: 1;
  overflow: visible;
}
.card:active { cursor: grabbing; }
.card-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: fill;
  pointer-events: none;
}
.card-icon {
  position: absolute;
  left: 20px; top: 50%;
  transform: translateY(-50%);
  height: 70%;
  width: auto;
  pointer-events: none;
  object-fit: contain;
}
.card-icon-car {
  position: absolute;
  left: 20px; top: 50%;
  transform: translateY(-50%);
  height: 92%;
  width: auto;
  pointer-events: none;
  object-fit: contain;
}
.card-icon-house {
  position: absolute;
  left: 20px; top: 50%;
  transform: translateY(-50%);
  height: 118%;
  width: auto;
  pointer-events: none;
  object-fit: contain;
}
.card-icon-tray {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  height: 65%;
  width: auto;
  pointer-events: none;
  object-fit: contain;
}
.card-value-tray {
  position: absolute;
  right: 6px; top: 50%;
  transform: translateY(-50%);
  color: white;
  font-weight: bold;
  font-size: 10px;
  pointer-events: none;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
}
.card-text {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  pointer-events: none;
  gap: 3px;
}
.card-text.indent { right: 28px; }
.card-number {
  color: white;
  font-weight: 700;
  font-size: 15px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
  line-height: 1.1;
}
.card-unit {
  color: white;
  font-weight: 600;
  font-size: 9px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
  margin-left: 3px;
  vertical-align: middle;
}
.card-label {
  color: #f5f500;
  font-weight: 600;
  font-size: 8px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: normal;
  word-break: keep-all;
  overflow-wrap: break-word;
  text-align: right;
  width: 100px;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.card.dragging { opacity: 0.35; }

.middle-wrapper {
  position: relative;
  display: inline-block;
}
.middle-img {
  display: block;
  pointer-events: none;
}
.middle-text {
  position: absolute;
  bottom: 18%; left: 45%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  gap: 2px;
}
.middle-value {
  color: #f5f500;
  font-weight: bold;
  font-size: 20px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
  line-height: 1.1;
}
.middle-label {
  color: white;
  font-weight: 600;
  font-size: 9px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  white-space: normal;
  text-align: center;
  max-width: 180px;
  text-transform: uppercase;
  letter-spacing: 0;
  line-height: 1.2;
}

#export-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(245,242,236,0.88);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: #2d3a2d;
  font-size: 16px;
}
#export-overlay.visible { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid #c8bfa8;
  border-top-color: #5a7a5a;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="toolbar" id="toolbar">
  <div class="toolbar-group">
    <span class="toolbar-label">Website:</span>
    <select id="sel-website" onchange="onWebsiteChange(this.value)"></select>
  </div>
  <div class="toolbar-group">
    <span class="toolbar-label">Page type:</span>
    <select id="sel-pagetype" onchange="onPagetypeChange(this.value)"></select>

<div class="main-layout" id="main-layout">

  <div class="infographic-wrapper">

              <svg id="needle-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;" viewBox="0 0 194 187">
                <g id="needle-line" style="transform-origin: 85.5px 84px; transform: rotate(-90deg);">

<!-- Rejtett AI összefoglaló oldal – html2canvas fogja renderelni -->
<div id="summary-page" style="
  position: fixed;
  left: -9999px;
  top: 0;
  width: 794px;

">
  <div id="sum-header" style="

  ">Carbon Crane – AI Summary Report</div>

<script>
// ── Python által befecskendezett adatok ──────────────────────────────────────
let rawStats  = {};
let labels    = {};
let websites  = [];
let pagetypes = {};
let C         = {};
let savedPanel = null;

try { rawStats  = JSON.parse(`{{RAW_STATS}}`);  } catch(e) {}
try { labels    = JSON.parse(`{{LABELS}}`);     } catch(e) {}
try { websites  = JSON.parse(`{{WEBSITES}}`);   } catch(e) {}
try { pagetypes = JSON.parse(`{{PAGETYPES}}`);  } catch(e) {}
try { C         = JSON.parse(`{{CONSTANTS}}`);  } catch(e) {}

const AI_SUMMARY = (function() { try { return {{AI_SUMMARY_JSON}}; } catch(e) { return ""; } })();
const SUMMARY_KEY = C.summary_key || 'Összesítő';

// ── SessionStorage: állapot visszatöltése ─────────────────────────────────────
try {
  const storedSessionId  = window.sessionStorage.getItem('cc_session_id');
  const currentSessionId = C.session_id || null;
  if (currentSessionId && storedSessionId === currentSessionId) {
    const raw = window.sessionStorage.getItem('cc_state');
    if (raw) savedPanel = JSON.parse(raw);
  } else {
    window.sessionStorage.removeItem('cc_state');
    if (currentSessionId) {
      window.sessionStorage.setItem('cc_session_id', currentSessionId);
    }
  }
} catch(e) {}

// ── Toolbar állapot visszatöltése ─────────────────────────────────────────────
let currentWebsite  = savedPanel?.website  || websites[0] || '';
let currentPagetype = savedPanel?.pagetype !== undefined ? savedPanel.pagetype : '';
let currentPV       = savedPanel?.pv       || C.default_pv || 120000000;

let panelState = {
  trayLeft:  ['kg_co2', 'wash', 'bp_paris'],
  trayRight: ['kg_saved', 'kwh', 'house'],
  left:  [],
  right: [],
};
if (savedPanel?.trayLeft) {
  panelState = {
    trayLeft:  savedPanel.trayLeft,
    trayRight: savedPanel.trayRight,
    left:      savedPanel.left,
    right:     savedPanel.right,
  };
}

// ── State mentés sessionStorage-ba ───────────────────────────────────────────
let _stateDebounceTimer = null;

function buildState() {
  return {
    trayLeft:  panelState.trayLeft,
    trayRight: panelState.trayRight,
    left:      panelState.left,
    right:     panelState.right,
    website:   currentWebsite,
    pagetype:  currentPagetype,
    pv:        currentPV,
  };
}

function saveStateNow() {
  try {
    window.sessionStorage.setItem('cc_state', JSON.stringify(buildState()));
  } catch(e) {}
}

function sendStateToParent() {
  clearTimeout(_stateDebounceTimer);
  _stateDebounceTimer = setTimeout(saveStateNow, 300);
}

// ── Számformázás ──────────────────────────────────────────────────────────────
function huFormat(val) {
  return Math.round(val).toLocaleString('hu-HU').replace(/,/g, ' ');
}

// ── Számítások ────────────────────────────────────────────────────────────────
function calcFromRaw(raw, pv) {
  const kg_co2   = raw.em_avg * pv / 1000;
  const kg_saved = kg_co2 * raw.red_pct;
  const kwh      = kg_saved / C.CO2_PER_KWH;
  const bp_km    = kg_co2 / C.CO2_PER_KM;
  const bp_trips = Math.round(bp_km / C.ref_km);
  return {
    kg_co2:               { num: huFormat(kg_co2),   unit: 'KG CO2E' },
    wash:                 { num: huFormat(kg_co2 / C.CO2_PER_WASH), unit: labels['unit_db']?.description || '' },
    bp_paris_trips:       { num: huFormat(bp_km),    unit: 'KM' },
    bp_paris_trips_count: bp_trips,
    kg_saved:             { num: huFormat(kg_saved), unit: 'KG CO2E' },
    kwh:                  { num: huFormat(kwh),      unit: 'KWH' },
    house:                { num: huFormat(kwh / C.KWH_PER_HOUSE), unit: '' },
    red_pct:              (raw.red_pct * 100).toFixed(1) + '%',
  };
}

function statsKey(website, pagetype) {
  if (!pagetype) return website === SUMMARY_KEY ? SUMMARY_KEY : website + '|';
  return `${website}|${pagetype}`;
}

function getCurrentCalc() {
  const key = statsKey(currentWebsite, currentPagetype);
  const raw = rawStats[key];
  if (!raw) return {};
  return calcFromRaw(raw, currentPV);
}

function isPagetypeView() {
  return !!currentPagetype;
}

function isSummaryView() {
  return currentWebsite === SUMMARY_KEY || !currentWebsite;
}

// ── PV input kezelés ──────────────────────────────────────────────────────────
function formatPVDisplay(val) {
  return Math.round(val).toLocaleString('hu-HU').replace(/,/g, ' ');
}

function parsePV(str) {
  const n = parseInt(str.replace(/\D/g, ''), 10);
  return (isNaN(n) || n <= 0) ? null : n;
}

function onPVInput(e) {
  const val = parsePV(e.target.value);
  if (val) {
    currentPV = val;
    updateValues();
    updateTexts();
    sendStateToParent();
  }
}

function onPVBlur(e) {
  const val = parsePV(e.target.value);
  if (val) currentPV = val;
  e.target.value = formatPVDisplay(currentPV);
  saveStateNow();
}

// ── Toolbar összerakása ────────────────────────────────────────────────────────
function buildWebsiteSelector() {
  const el = document.getElementById('sel-website');
  el.innerHTML = '';
  websites.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w;
    opt.textContent = w === SUMMARY_KEY
      ? (labels['all_website']?.description || w)
      : w;
    if (w === currentWebsite) opt.selected = true;
    el.appendChild(opt);
  });
}

function buildPagetypeSelector(website) {
  const el = document.getElementById('sel-pagetype');
  el.innerHTML = '';
  const pts = pagetypes[website] || [];
  if (pts.length === 0) {
    el.disabled = true;
    const opt = document.createElement('option');
    opt.textContent = '–';
    el.appendChild(opt);
    return;
  }
  el.disabled = false;
  const allOpt = document.createElement('option');
  allOpt.value = '';
  allOpt.textContent = labels['all_pagetype']?.description || 'All pages';
  if (currentPagetype === '') allOpt.selected = true;
  el.appendChild(allOpt);
  pts.forEach(pt => {
    const opt = document.createElement('option');
    opt.value = pt;
    opt.textContent = pt;
    if (pt === currentPagetype) opt.selected = true;
    el.appendChild(opt);
  });
}

function onWebsiteChange(website) {
  currentWebsite  = website;
  currentPagetype = '';
  buildPagetypeSelector(website);
  updateValues();
  saveStateNow();
}

function onPagetypeChange(pagetype) {
  currentPagetype = pagetype;
  updateValues();
  saveStateNow();
}

// ── Szöveges overlay-ek ───────────────────────────────────────────────────────
function tpl(template) {
  const args = Array.prototype.slice.call(arguments, 1);
  let i = 0;
  return template.replace(/\{\}/g, () => (i < args.length ? args[i++] : ''));
}

function buildFilterLabel() {
  const site = isSummaryView()
    ? (labels['all_website']?.description || SUMMARY_KEY)
    : currentWebsite;
  const pt  = currentPagetype || (labels['all_pagetype']?.description || 'All pages');
  return `${site}: ${pt}`;
}

function buildSubtitle() {
  const n = (websites || []).filter(w => w !== SUMMARY_KEY).length;
  if (isSummaryView()) {
    return tpl(
      labels['subtitle_multi']?.description || 'What is the CO\u2082e footprint of a shopping journey across {} websites?',
      n
    );
  }
  return tpl(
    labels['subtitle_single']?.description || 'What is the CO\u2082e footprint of {}?',
    currentWebsite
  );
}

function buildPVLabel() {
  const pvStr = formatPVDisplay(currentPV);
  const n     = (websites || []).filter(w => w !== SUMMARY_KEY).length;
  const pt    = currentPagetype;

  if (isSummaryView()) {
    if (isPagetypeView()) {
      return tpl(
        labels['pv_multi_page']?.description || 'For {} page views across {} websites: {}',
        pvStr, n, pt
      );
    } else {
      return tpl(
        labels['pv_multi_visit']?.description || 'For {} visits across {} websites',
        pvStr, n
      );
    }
  } else {
    if (isPagetypeView()) {
      return tpl(
        labels['pv_single_page']?.description || 'For {} page views \u2013 {}: {}',
        pvStr, currentWebsite, pt
      );
    } else {
      return tpl(
        labels['pv_single_visit']?.description || 'For {} visits \u2013 {}',
        pvStr, currentWebsite
      );
    }
  }
}

function updateTexts() {
  document.getElementById('infog-filter-label').textContent = buildFilterLabel();
  document.getElementById('infog-subtitle').textContent     = buildSubtitle();
  document.getElementById('infog-pv-label').textContent     = buildPVLabel();
}

// ── Kártya értékek ─────────────────────────────────────────────────────────────
const BASE_SCALE = 0.57;
const DIMS = {
  bal: {
    tarolo:       { w: 130, h: 50 },
    fent:         { w: Math.round(320*BASE_SCALE), h: Math.round(97*BASE_SCALE) },
    kozep:        { w: Math.round(320*BASE_SCALE), h: Math.round(97*BASE_SCALE) },
    lent:         { w: Math.round(353*BASE_SCALE), h: Math.round(104*BASE_SCALE) },
    lent_egyedul: { w: Math.round(353*BASE_SCALE), h: Math.round(104*BASE_SCALE) },
  },
  jobb: {
    tarolo:       { w: 130, h: 50 },
    fent:         { w: Math.round(320*BASE_SCALE), h: Math.round(97*BASE_SCALE) },
    kozep:        { w: Math.round(320*BASE_SCALE), h: Math.round(97*BASE_SCALE) },
    lent:         { w: Math.round(320*BASE_SCALE), h: Math.round(104*BASE_SCALE) },
    lent_egyedul: { w: Math.round(320*BASE_SCALE), h: Math.round(104*BASE_SCALE) },
  }
};
const REF_WIDTH = 800;

function updateDragdropScale() {
  const infEl = document.getElementById('export-target');
  const area  = document.getElementById('dragdrop-area');
  if (!infEl || !area) return;
  area.style.transform = `scale(${infEl.offsetWidth / REF_WIDTH})`;
}

function notifyHeight() {
  const toolbar    = document.getElementById('toolbar');
  const mainLayout = document.getElementById('main-layout');
  if (!toolbar || !mainLayout) return;
  const total = Math.ceil(
    toolbar.getBoundingClientRect().height +
    mainLayout.getBoundingClientRect().height +
    16*2 + 12*3
  ) + 8;
  window.parent.postMessage({ type: 'streamlit:setFrameHeight', height: total }, '*');
}

const IMGS = {
  bal:  { tarolo:'cards/sima_tarolo_bal.png', fent:'cards/sima_fent_bal.png', kozep:'cards/sima_kozep_bal.png', lent:'cards/sima_lent_bal.png', lent_egyedul:'cards/sima_lent_egyedul_bal.png' },
  jobb: { tarolo:'cards/sima_tarolo_jobb.png', fent:'cards/sima_fent_jobb.png', kozep:'cards/sima_kozep_jobb.png', lent:'cards/sima_lent_jobb.png', lent_egyedul:'cards/sima_lent_egyedul_jobb.png' },
  ora:  { egyedul:'cards/ora_egyedul.png', bal:'cards/ora_bal.png', jobb:'cards/ora_jobb.png', mindketto:'cards/ora_mindketto.png' }
};

const CARDS = {
  kg_co2:   { side:'left',  icon:'cards/kg.png',        valueKey:'kg_co2',        labelKey:'kg_co2'   },
  wash:     { side:'left',  icon:'cards/washing.png',   valueKey:'wash',           labelKey:'wash'     },
  bp_paris: { side:'left',  icon:'cards/car.png',       valueKey:'bp_paris_trips', labelKey:'bp_paris' },
  kg_saved: { side:'right', icon:'cards/kg.png',        valueKey:'kg_saved',       labelKey:'kg_saved' },
  kwh:      { side:'right', icon:'cards/light.png',     valueKey:'kwh',            labelKey:'kwh'      },
  house:    { side:'right', icon:'cards/household.png', valueKey:'house',          labelKey:'house'    },
};

let dragged = null;

function getValue(cardId) {
  const key  = CARDS[cardId].valueKey;
  const calc = getCurrentCalc();
  const val  = calc[key];
  if (val && typeof val === 'object') return val.num || '';
  return val || '';
}

function getUnit(cardId) {
  const key  = CARDS[cardId].valueKey;
  const calc = getCurrentCalc();
  const val  = calc[key];
  if (val && typeof val === 'object') return val.unit || '';
  return '';
}

function getLabel(cardId) {
  const lk = CARDS[cardId].labelKey;
  const l  = labels[lk];
  if (!l) return '';
  if (lk === 'bp_paris') {
    const trips = getCurrentCalc()?.bp_paris_trips_count ?? '';
    return trips ? `${trips} \u00d7 ${l.route}` : l.route;
  }
  return l.description || '';
}

function updateValues() {
  document.querySelectorAll('[data-card-id]').forEach(el => {
    el.textContent = getValue(el.dataset.cardId);
  });
  document.querySelectorAll('[data-label-id]').forEach(el => {
    el.textContent = getLabel(el.dataset.labelId);
  });

  const calc      = getCurrentCalc();
  const redPctStr = calc?.red_pct || '0%';
  document.getElementById('middle-value').textContent = redPctStr;

  const redPctLabel = isSummaryView()
    ? (labels['red_pct_multi']?.description  || 'AVERAGE REDUCTION POTENTIAL')
    : (labels['red_pct_single']?.description || 'REDUCTION POTENTIAL');
  document.getElementById('middle-label').textContent = redPctLabel;

  const angle  = (parseFloat(redPctStr) / 100) * 180 - 90;
  const needle = document.getElementById('needle-line');
  if (needle) needle.style.transform = `rotate(${angle}deg)`;

  updateTexts();
}

// ── Panel renderelés ──────────────────────────────────────────────────────────
function getState(panelId, idx, total) {
  if (total === 1) return 'lent_egyedul';
  if (idx === 0)   return 'lent';
  if (idx === total - 1) return 'fent';
  return 'kozep';
}

function getSide(panelId) {
  return panelId === 'left' ? 'bal' : 'jobb';
}

function getFrom(id) {
  if (panelState.trayLeft.includes(id))  return 'trayLeft';
  if (panelState.trayRight.includes(id)) return 'trayRight';
  if (panelState.left.includes(id))      return 'left';
  if (panelState.right.includes(id))     return 'right';
}

function removeFromState(id, from) {
  panelState[from] = panelState[from].filter(c => c !== id);
}

function render() {
  renderTray('tray-left',  panelState.trayLeft,  'left');
  renderTray('tray-right', panelState.trayRight, 'right');
  renderPanel('left',  panelState.left);
  renderPanel('right', panelState.right);
  updateMiddle();
  updateValues();
  updateDragdropScale();
  setTimeout(notifyHeight, 150);
  sendStateToParent();
}

function renderTray(elId, cards, side) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  [0, 1, 2].forEach(i => {
    const slot = document.createElement('div');
    slot.className = 'tray-slot' + (cards[i] ? ' has-card' : '');
    if (cards[i]) slot.appendChild(makeCard(cards[i], 'tray'));
    el.appendChild(slot);
  });
  el.ondragover  = e => { e.preventDefault(); el.classList.add('dragover'); };
  el.ondragleave = e => { if (!el.contains(e.relatedTarget)) el.classList.remove('dragover'); };
  el.ondrop = e => {
    e.preventDefault();
    el.classList.remove('dragover');
    if (!dragged) return;
    if (CARDS[dragged.id].side !== side) return;
    const trayKey = `tray${side === 'left' ? 'Left' : 'Right'}`;
    if (panelState[trayKey].includes(dragged.id)) return;
    if (panelState[trayKey].length >= 3) return;
    removeFromState(dragged.id, dragged.from);
    panelState[trayKey].push(dragged.id);
    dragged = null;
    render();
  };
}

function renderPanel(panelId, cards) {
  const el    = document.getElementById(panelId);
  el.innerHTML = '';
  const side  = getSide(panelId);
  const total = cards.length;
  const fullH = DIMS[side].lent.h + DIMS[side].kozep.h + DIMS[side].fent.h;
  el.style.height = `${fullH}px`;
  const emptyHeights = [DIMS[side].lent.h, DIMS[side].kozep.h, DIMS[side].fent.h];

  for (let i = 0; i < 3; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    if (cards[i]) {
      const st  = getState(panelId, i, total);
      const dim = DIMS[side][st];
      slot.style.width  = `${dim.w}px`;
      slot.style.height = `${dim.h}px`;
      slot.appendChild(makeCard(cards[i], panelId, i, total));
    } else {
      slot.classList.add('empty-slot');
      slot.style.width  = `${DIMS[side].fent.w}px`;
      slot.style.height = `${emptyHeights[i]}px`;
    }
    slot.ondragover  = e => { e.preventDefault(); e.stopPropagation(); slot.classList.add('slot-dragover'); };
    slot.ondragleave = e => { if (!slot.contains(e.relatedTarget)) slot.classList.remove('slot-dragover'); };
    slot.ondrop = e => {
      e.preventDefault();
      e.stopPropagation();
      slot.classList.remove('slot-dragover');
      if (!dragged) return;
      if (CARDS[dragged.id].side !== panelId) return;
      const fromPanel = dragged.from;
      if (fromPanel === panelId) {
        const src = [...panelState[panelId]];
        const si  = src.indexOf(dragged.id);
        if (si === i) return;
        src.splice(si, 1);
        src.splice(i, 0, dragged.id);
        panelState[panelId] = src;
      } else {
        if (panelState[panelId].length >= 3) return;
        removeFromState(dragged.id, fromPanel);
        panelState[panelId].splice(i, 0, dragged.id);
      }
      dragged = null;
      render();
    };
    el.appendChild(slot);
  }
  el.ondragover = e => e.preventDefault();
  el.ondrop = e => {
    e.preventDefault();
    if (!dragged || dragged.from === panelId) return;
    if (CARDS[dragged.id].side !== panelId) return;
    if (panelState[panelId].length >= 3) return;
    removeFromState(dragged.id, dragged.from);
    panelState[panelId].push(dragged.id);
    dragged = null;
    render();
  };
}

function makeCard(id, context, idx, total) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  const side = CARDS[id].side === 'left' ? 'bal' : 'jobb';

  const bg = document.createElement('img');
  bg.className   = 'card-bg';
  bg.crossOrigin = 'anonymous';

  if (context === 'tray') {
    card.style.width  = '130px';
    card.style.height = '50px';
    bg.src = IMGS[side].tarolo;
    card.appendChild(bg);
    const icon = document.createElement('img');
    icon.className = 'card-icon-tray';
    icon.src = CARDS[id].icon;
    icon.crossOrigin = 'anonymous';
    card.appendChild(icon);
    const val = document.createElement('span');
    val.className      = 'card-value-tray';
    val.dataset.cardId = id;
    val.textContent    = getValue(id);
    card.appendChild(val);
  } else {
    const st  = getState(context, idx, total);
    const dim = DIMS[side][st];
    card.style.width  = `${dim.w}px`;
    card.style.height = `${dim.h}px`;
    bg.src = IMGS[side][st];
    card.appendChild(bg);

    const icon = document.createElement('img');
    icon.className = id === 'house'    ? 'card-icon-house'
                   : id === 'bp_paris' ? 'card-icon-car'
                   : 'card-icon';
    icon.src = CARDS[id].icon;
    icon.crossOrigin = 'anonymous';
    card.appendChild(icon);

    const textBlock = document.createElement('div');
    textBlock.className = 'card-text' + (context === 'left' && idx === 0 ? ' indent' : '');

    const numRow = document.createElement('div');
    numRow.style.cssText = 'display:flex;align-items:baseline;gap:3px;';
    const numEl = document.createElement('span');
    numEl.className    = 'card-number';
    numEl.dataset.cardId = id;
    numEl.textContent  = getValue(id);
    numRow.appendChild(numEl);

    const unit = getUnit(id);
    if (unit) {
      const unitEl = document.createElement('span');
      unitEl.className   = 'card-unit';
      unitEl.textContent = unit;
      numRow.appendChild(unitEl);
    }
    textBlock.appendChild(numRow);

    const labelText = getLabel(id);
    if (labelText) {
      const labelEl = document.createElement('span');
      labelEl.className     = 'card-label';
      labelEl.dataset.labelId = id;
      labelEl.textContent   = labelText;
      textBlock.appendChild(labelEl);
    }
    card.appendChild(textBlock);
  }

  card.ondragstart = e => {
    e.stopPropagation();
    dragged = { id, from: getFrom(id) };
    setTimeout(() => card.classList.add('dragging'), 0);
  };
  card.ondragend = () => {
    card.classList.remove('dragging');
    if (dragged) { dragged = null; render(); }
  };
  return card;
}

function updateMiddle() {
  const hasL = panelState.left.length  > 0;
  const hasR = panelState.right.length > 0;
  let key = 'egyedul';
  if (hasL && hasR)   key = 'mindketto';
  else if (hasL)      key = 'bal';
  else if (hasR)      key = 'jobb';
  document.getElementById('middle').src = IMGS.ora[key];
}

// ── Export ────────────────────────────────────────────────────────────────────
// ── Export ────────────────────────────────────────────────────────────────────
function showExportOverlay(msg) {
    document.getElementById('export-msg').textContent = msg;
    document.getElementById('export-overlay').classList.add('visible');
}
 
function hideExportOverlay() {
    document.getElementById('export-overlay').classList.remove('visible');
}
 
async function captureCanvas() {
    await Promise.race([
        document.fonts.ready,
        new Promise(resolve => setTimeout(resolve, 3000)),
    ]);
    const emptySlots = document.querySelectorAll('.empty-slot');
    emptySlots.forEach(s => s.classList.add('export-hide'));
    const canvas = await html2canvas(document.getElementById('export-target'), {
        useCORS: true, allowTaint: false, scale: 4, backgroundColor: null, logging: false,
    });
    emptySlots.forEach(s => s.classList.remove('export-hide'));
    return canvas;
}
 
function exportTimestamp() {
    const n = new Date();
    return `${n.getFullYear()}${String(n.getMonth()+1).padStart(2,'0')}${String(n.getDate()).padStart(2,'0')}`
         + `_${String(n.getHours()).padStart(2,'0')}${String(n.getMinutes()).padStart(2,'0')}${String(n.getSeconds()).padStart(2,'0')}`;
}
 
function exportFilename(ext) {
    const lang = (C.lang_code || 'hu').replace('-', '_');
    return `infografika_${lang}_${exportTimestamp()}.${ext}`;
}
 
async function exportPNG() {
    showExportOverlay('Saving image...');
    try {
        const canvas = await captureCanvas();
        const link   = document.createElement('a');
        link.download = exportFilename('png');
        link.href     = canvas.toDataURL('image/png');
        link.click();
    } catch(e) {
        alert('Export error: ' + e.message);
    } finally {
        hideExportOverlay();
    }
}
 
async function exportPDF() {
    showExportOverlay('Saving PDF...');
    try {
        document.body.classList.add('export-mode');
 
        const canvas  = await captureCanvas();
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
 
        
        const PX_TO_MM = 25.4 / (96 * 4);
        const pdfW = canvas.width  * PX_TO_MM;
        const pdfH = canvas.height * PX_TO_MM;
 
        const pdf = new jsPDF({
            orientation: pdfW >= pdfH ? 'landscape' : 'portrait',
            unit:   'mm',
            format: [pdfW, pdfH],
        });
        pdf.addImage(imgData, 'PNG', 0, 0, pdfW, pdfH);
 
        if (AI_SUMMARY && AI_SUMMARY.trim()) {
            const today    = new Date().toISOString().slice(0, 10);
            const scopeTxt = currentWebsite === (C.summary_key || 'Összesítő')
                ? 'All websites' : currentWebsite;
            const ptTxt    = currentPagetype || 'All pages';
 
            document.getElementById('sum-meta').textContent =
                `Scope: ${scopeTxt}  ·  Page type: ${ptTxt}  ·  ${today}`;
            document.getElementById('sum-body').innerHTML = AI_SUMMARY
                .split(/\n\n+/)
                .filter(p => p.trim())
                .map(p => `<p style="margin:0 0 18px 0;">${p.trim().replace(/\n/g, ' ')}</p>`)
                .join('');
 
            await document.fonts.ready;
            const sumEl     = document.getElementById('summary-page');
            const sumCanvas = await html2canvas(sumEl, {
                useCORS: true, allowTaint: false,
                scale: 2, backgroundColor: '#ffffff', logging: false,
                width: 794, height: sumEl.scrollHeight, windowWidth: 794,
            });
            const sumImgData = sumCanvas.toDataURL('image/png');
            const sumPageW   = 210;
            const sumPageH   = sumPageW * sumCanvas.height / sumCanvas.width;
            pdf.addPage([sumPageW, Math.max(297, sumPageH)], 'portrait');
            pdf.addImage(sumImgData, 'PNG', 0, 0, sumPageW, sumPageH);
        }
 
        pdf.save(exportFilename('pdf'));
    } catch(e) {
        alert('PDF export error: ' + e.message);
    } finally {
        document.body.classList.remove('export-mode');
        hideExportOverlay();
    }
}

// ── Inicializálás ─────────────────────────────────────────────────────────────
buildWebsiteSelector();
buildPagetypeSelector(currentWebsite);
document.getElementById('pv-input').value = formatPVDisplay(currentPV);

const bgImg = document.getElementById('bg-img');
const fontReady = document.fonts.ready;
const imgReady  = new Promise(resolve => {
  if (bgImg.complete) resolve(); else bgImg.onload = resolve;
});
Promise.all([fontReady, imgReady]).then(() => render());

const ro = new ResizeObserver(() => { updateDragdropScale(); setTimeout(notifyHeight, 150); });
ro.observe(document.getElementById('export-target'));
</script>
